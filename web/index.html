<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BOSS</title>
<style>
/* O CSS continua o mesmo, pode manter o seu */
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #0D1117; color: #E8EDF2; font-family: -apple-system, 'Segoe UI', Roboto, sans-serif; height: 100vh; display: flex; flex-direction: column; }
header { background: #080A0F; border-bottom: 1px solid rgba(0,255,204,0.15); padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; }
.logo { color: #00FFCC; font-size: 14px; font-weight: bold; letter-spacing: 0.3em; }
.status { font-size: 10px; color: #6A7A8A; letter-spacing: 0.1em; }
.status.ok { color: #27AE60; } .status.err { color: #E74C3C; }
#chat { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
.msg { max-width: 85%; padding: 10px 14px; border-radius: 12px; font-size: 14px; line-height: 1.5; white-space: pre-wrap; word-wrap: break-word; }
.msg.user { background: rgba(0,255,204,0.1); border: 1px solid rgba(0,255,204,0.3); align-self: flex-end; color: #E8EDF2; }
.msg.boss { background: #1A1F28; border: 1px solid rgba(255,255,255,0.05); align-self: flex-start; color: #C8D4E0; }
.msg.error { background: rgba(231,76,60,0.1); border: 1px solid rgba(231,76,60,0.3); align-self: center; color: #E74C3C; font-size: 12px; }
.msg.thinking { color: #4A5560; font-style: italic; }
footer { padding: 12px 20px; border-top: 1px solid rgba(0,255,204,0.1); background: #080A0F; display: flex; gap: 8px; align-items: center; }
#input { flex: 1; background: #1A1F28; border: 1px solid rgba(0,255,204,0.2); color: #E8EDF2; padding: 10px 14px; border-radius: 8px; font-size: 14px; font-family: inherit; resize: none; outline: none; }
#input:focus { border-color: #00FFCC; }
.btn { background: #00FFCC; color: #0D1117; border: none; padding: 10px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 14px; }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }
.btn-mic { background: #1A1F28; border: 1px solid #00FFCC; color: #00FFCC; padding: 10px; border-radius: 8px; cursor: pointer; font-size: 18px; }
.btn-mic.gravando { background: #E74C3C; border-color: #E74C3C; color: white; animation: pulse 1s infinite; }
@keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
.config { padding: 20px; display: none; background: #121820; border-bottom: 1px solid #2A3A4A; }
.config.open { display: block; }
.config select { width: 100%; background: #1A1F28; border: 1px solid rgba(0,255,204,0.2); color: #E8EDF2; padding: 10px; border-radius: 8px; margin-bottom: 12px; font-size: 14px; }
</style>
</head>
<body>

<header>
  <div class="logo">BOSS</div>
  <div style="display:flex;gap:12px;align-items:center">
    <div id="status" class="status">CARREGANDO...</div>
    <div id="userDisplay" style="font-size:12px; color:#00FFCC;">Chefe</div>
    <button class="btn" style="padding:6px 12px; font-size:10px;" onclick="toggleConfig()">⚙</button>
  </div>
</header>

<div id="config" class="config">
  <label style="font-size:11px; color:#6A7A8A;">PERFIL DO USUÁRIO</label>
  <select id="userSelect" onchange="mudarUsuario()">
    <option value="Chefe">Chefe (Engenheiro)</option>
    <option value="Mecânico">Mecânico (Diagnóstico)</option>
    <option value="Convidado">Convidado (Visão Geral)</option>
  </select>
</div>

<div id="chat">
  <div class="msg boss">BOSS online. Contexto carregado. Como posso ajudar, Chefe?</div>
</div>

<footer>
  <button id="btnMic" class="btn-mic" onclick="toggleGravacao()">🎤</button>
  <textarea id="input" rows="1" placeholder="Digite ou fale..."></textarea>
  <button id="send" class="btn" onclick="enviar()">ENVIAR</button>
</footer>

<script>
// Nenhum token aqui! O Worker cuida de tudo.
const WORKER_URL = 'https://boss-proxy.lexpaker.workers.dev'; 
const REPO_PROJETO = 'lexpaker-arch/EXODASH--Local'; 
const REPO_CONTEXTO = 'lexpaker-arch/CHEFE-';

const MODELO = 'qwen/qwen3.8-27b';
let userRole = localStorage.getItem('boss_role') || 'Chefe';
let historico = [];
let contextoCache = { projetos: '', codigoReal: '' };

document.getElementById('userDisplay').textContent = userRole;
document.getElementById('userSelect').value = userRole;

async function carregarContexto() {
  try {
    // 1. Busca os arquivos .md (texto puro, pode ser via raw.githubusercontent)
    const rawBase = `https://raw.githubusercontent.com/${REPO_CONTEXTO}/main/contexto`;
    const [projetos, decisoes] = await Promise.all([
      fetch(`${rawBase}/projetos.md`).then(r => r.text()),
      fetch(`${rawBase}/decisoes.md`).then(r => r.text())
    ]);
    contextoCache.projetos = projetos + "\n" + decisoes;

    // 2. Busca o código-fonte REAL, mas passa pelo Worker para esconder o token
    const fetchCode = (path) => fetch(`${WORKER_URL}/github?repo=${REPO_PROJETO}&path=${path}`).then(r => r.json());
    
    const [mainAct, obdSvc] = await Promise.all([
      fetchCode('app/src/main/java/com/exodash/MainActivity.kt'),
      fetchCode('app/src/main/java/com/exodash/ObdUsbService.kt')
    ]);
    
    const decode = (b64) => decodeURIComponent(escape(atob(b64)));
    
    if(mainAct.content && obdSvc.content) {
        contextoCache.codigoReal = `--- MainActivity.kt ---\n${decode(mainAct.content)}\n\n--- ObdUsbService.kt ---\n${decode(obdSvc.content)}`;
    } else {
        contextoCache.codigoReal = "Erro ao ler o código. Verifique o Worker.";
    }

    atualizarStatus(true);
  } catch (e) {
    console.error('Erro contexto:', e);
    atualizarStatus(false);
  }
}

function atualizarStatus(ok) {
  const el = document.getElementById('status');
  el.textContent = ok ? '● ONLINE' : '● OFFLINE';
  el.className = ok ? 'status ok' : 'status err';
}

function toggleConfig() { document.getElementById('config').classList.toggle('open'); }

function mudarUsuario() {
  userRole = document.getElementById('userSelect').value;
  localStorage.setItem('boss_role', userRole);
  document.getElementById('userDisplay').textContent = userRole;
  addMsg('boss', `Perfil alterado para ${userRole}. Como posso ajudar?`);
}

function addMsg(tipo, texto) {
  const chat = document.getElementById('chat');
  const div = document.createElement('div');
  div.className = `msg ${tipo}`;
  div.textContent = texto;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return div;
}

function buildSystemPrompt() {
  let roleInstruction = "";
  if (userRole === "Chefe") roleInstruction = "O usuário é o Chefe, o criador do sistema. Fale de forma técnica, direta, sem simplificar termos de engenharia.";
  else if (userRole === "Mecânico") roleInstruction = "O usuário é um mecânico. Foque em diagnóstico prático, OBD, DTCs e peças. Evite jargões de programação.";
  else roleInstruction = "O usuário é um convidado. Seja educado, explique os conceitos de forma simples e ajude no que for possível.";

  return `Você é o BOSS, assistente dos projetos EXODASH e EXO VIGILANTE.
${roleInstruction}

=== CONTEXTO DOS PROJETOS ===
${contextoCache.projetos}

=== CÓDIGO-FONTE REAL ===
${contextoCache.codigoReal}

Use o código-fonte acima para responder perguntas sobre como as coisas funcionam no código.`;
}

async function enviar() {
  const input = document.getElementById('input');
  const texto = input.value.trim();
  if (!texto) return;

  input.value = '';
  addMsg('user', texto);
  historico.push({ role: 'user', content: texto });

  const thinking = addMsg('thinking', 'BOSS pensando...');
  document.getElementById('send').disabled = true;

  try {
    const messages = [
      { role: 'system', content: buildSystemPrompt() },
      ...historico.slice(-8) 
    ];

    const resp = await fetch(WORKER_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ model: MODELO, messages, max_tokens: 1000, temperature: 0.3 })
    });

    const data = await resp.json();
    const resposta = data.choices?.[0]?.message?.content?.trim() || '(sem resposta)';

    thinking.remove();
    addMsg('boss', resposta);
    historico.push({ role: 'assistant', content: resposta });

    falarTexto(resposta);

  } catch (e) {
    thinking.remove();
    addMsg('error', `Erro: ${e.message}`);
  } finally {
    document.getElementById('send').disabled = false;
    input.focus();
  }
}

let reconhecimento;
let gravando = false;

function toggleGravacao() {
  const btn = document.getElementById('btnMic');
  
  if (gravando) {
    reconhecimento.stop();
    btn.classList.remove('gravando');
    gravando = false;
    return;
  }

  if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
    alert("Seu navegador não suporta reconhecimento de voz.");
    return;
  }

  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  reconhecimento = new SpeechRecognition();
  reconhecimento.lang = 'pt-BR';
  reconhecimento.interimResults = false;

  reconhecimento.onstart = () => {
    btn.classList.add('gravando');
    gravando = true;
  };

  reconhecimento.onresult = (event) => {
    const texto = event.results[0][0].transcript;
    document.getElementById('input').value = texto;
    enviar();
  };

  reconhecimento.onend = () => {
    btn.classList.remove('gravando');
    gravando = false;
  };

  reconhecimento.start();
}

function falarTexto(texto) {
  if (!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const utterance = new SpeechSynthesisUtterance(texto);
  utterance.lang = 'pt-BR';
  const voices = window.speechSynthesis.getVoices();
  const ptVoice = voices.find(v => v.lang.includes('pt-BR'));
  if (ptVoice) utterance.voice = ptVoice;
  utterance.rate = 1.1;
  window.speechSynthesis.speak(utterance);
}

document.getElementById('input').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); enviar(); }
});

carregarContexto();
</script>
</body>
</html>
