<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BOSS - EXO Interface</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #05070A; color: #E8EDF2; font-family: -apple-system, 'Segoe UI', Roboto, sans-serif; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

/* HEADER */
header { background: #080A0F; border-bottom: 1px solid rgba(0,255,204,0.15); padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; z-index: 10; }
.logo { color: #00FFCC; font-size: 14px; font-weight: bold; letter-spacing: 0.3em; }
.status { font-size: 10px; color: #6A7A8A; letter-spacing: 0.1em; }
.status.ok { color: #27AE60; } .status.err { color: #E74C3C; }

/* ÁREA CENTRAL (ARO E CHAT) */
main { flex: 1; display: flex; flex-direction: column; align-items: center; position: relative; overflow: hidden; }

/* O ARO EXO */
.exo-container { margin-top: 30px; position: relative; width: 160px; height: 160px; display: flex; justify-content: center; align-items: center; cursor: pointer; transition: all 0.3s ease; }
.exo-glow { position: absolute; width: 160px; height: 160px; border-radius: 50%; background: radial-gradient(circle, rgba(0,255,204,0.2) 0%, transparent 70%); transition: all 0.3s ease; }
.exo-anel-ext { position: absolute; width: 140px; height: 140px; border-radius: 50%; border: 1px dashed rgba(0,255,204,0.4); animation: gira 15s linear infinite; transition: all 0.3s ease; }
.exo-anel-int { position: absolute; width: 110px; height: 110px; border-radius: 50%; border: 2px solid rgba(0,255,204,0.3); border-top-color: #00FFCC; border-bottom-color: #00FFCC; animation: gira-rev 10s linear infinite; transition: all 0.3s ease; }
.exo-btn { position: relative; width: 80px; height: 80px; border-radius: 50%; background: radial-gradient(circle at 30% 30%, #1A1F28, #0A0D12); border: 2px solid #00FFCC; display: flex; justify-content: center; align-items: center; font-size: 24px; color: #00FFCC; box-shadow: 0 0 20px rgba(0,255,204,0.3); transition: all 0.3s ease; }

@keyframes gira { to { transform: rotate(360deg); } }
@keyframes gira-rev { to { transform: rotate(-360deg); } }

/* ESTADOS DO ARO */
.exo-container.ouvindo .exo-btn { border-color: #E74C3C; color: #E74C3C; box-shadow: 0 0 30px rgba(231,76,60,0.5); animation: pulse-fast 1s infinite; }
.exo-container.ouvindo .exo-glow { background: radial-gradient(circle, rgba(231,76,60,0.3) 0%, transparent 70%); }
.exo-container.ouvindo .exo-anel-ext { border-color: rgba(231,76,60,0.4); animation-duration: 5s; }
.exo-container.ouvindo .exo-anel-int { border-color: rgba(231,76,60,0.3); border-top-color: #E74C3C; border-bottom-color: #E74C3C; animation-duration: 3s; }

.exo-container.pensando .exo-btn { border-color: #F1C40F; color: #F1C40F; box-shadow: 0 0 30px rgba(241,196,15,0.5); }
.exo-container.pensando .exo-glow { background: radial-gradient(circle, rgba(241,196,15,0.2) 0%, transparent 70%); }
.exo-container.pensando .exo-anel-ext { border-color: rgba(241,196,15,0.4); animation-duration: 2s; }

.exo-container.falando .exo-btn { border-color: #00FFCC; color: #00FFCC; box-shadow: 0 0 40px rgba(0,255,204,0.6); animation: pulse-slow 1.5s infinite; }

@keyframes pulse-fast { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
@keyframes pulse-slow { 0% { box-shadow: 0 0 20px rgba(0,255,204,0.3); } 50% { box-shadow: 0 0 50px rgba(0,255,204,0.8); } 100% { box-shadow: 0 0 20px rgba(0,255,204,0.3); } }

/* CHAT */
#chat { flex: 1; width: 100%; max-width: 800px; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; mask-image: linear-gradient(to bottom, transparent, black 5%, black 95%, transparent); }
.msg { max-width: 85%; padding: 12px 16px; border-radius: 12px; font-size: 14px; line-height: 1.5; word-wrap: break-word; }
.msg.user { background: rgba(0,255,204,0.1); border: 1px solid rgba(0,255,204,0.3); align-self: flex-end; color: #E8EDF2; }
.msg.boss { background: #1A1F28; border: 1px solid rgba(255,255,255,0.05); align-self: flex-start; color: #C8D4E0; }
.msg.error { background: rgba(231,76,60,0.1); border: 1px solid rgba(231,76,60,0.3); align-self: center; color: #E74C3C; font-size: 12px; text-align: center; }
.msg.thinking { color: #4A5560; font-style: italic; }

/* RODAPÉ (INPUT DE TEXTO) */
footer { padding: 12px 20px; background: #080A0F; display: flex; gap: 8px; align-items: center; justify-content: center; border-top: 1px solid rgba(0,255,204,0.1); }
.footer-content { width: 100%; max-width: 800px; display: flex; gap: 8px; }
#input { flex: 1; background: #1A1F28; border: 1px solid rgba(0,255,204,0.2); color: #E8EDF2; padding: 12px 16px; border-radius: 8px; font-size: 14px; resize: none; outline: none; }
#input:focus { border-color: #00FFCC; }
.btn { background: #00FFCC; color: #0D1117; border: none; padding: 10px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 14px; }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }

/* CONFIG */
.config { padding: 20px; display: none; background: #121820; border-bottom: 1px solid #2A3A4A; position: absolute; top: 50px; right: 20px; z-index: 20; border-radius: 8px; box-shadow: 0 10px 30px rgba(0,0,0,0.8); }
.config.open { display: block; }
.config select { width: 100%; background: #1A1F28; border: 1px solid rgba(0,255,204,0.2); color: #E8EDF2; padding: 10px; border-radius: 8px; font-size: 14px; }
</style>
</head>
<body>

<header>
  <div class="logo">BOSS</div>
  <div style="display:flex;gap:12px;align-items:center">
    <div id="status" class="status">CARREGANDO...</div>
    <div id="userDisplay" style="font-size:12px; color:#00FFCC;">Chefe</div>
    <button class="btn" style="padding:6px 12px; font-size:10px; background:transparent; border:1px solid #6A7A8A; color:#6A7A8A;" onclick="toggleConfig()">⚙</button>
  </div>
</header>

<div id="config" class="config">
  <label style="font-size:11px; color:#6A7A8A; margin-bottom:8px; display:block;">PERFIL DO USUÁRIO</label>
  <select id="userSelect" onchange="mudarUsuario()">
    <option value="Chefe">Chefe (Engenheiro)</option>
    <option value="Mecânico">Mecânico (Diagnóstico)</option>
    <option value="Convidado">Convidado (Visão Geral)</option>
  </select>
</div>

<main>
  <!-- O ARO EXO -->
  <div id="exoContainer" class="exo-container" onclick="toggleGravacao()">
    <div class="exo-glow"></div>
    <div class="exo-anel-ext"></div>
    <div class="exo-anel-int"></div>
    <div class="exo-btn">⚡</div>
  </div>

  <!-- CHAT -->
  <div id="chat">
    <div class="msg boss">BOSS online. Toque no aro central para falar ou digite abaixo.</div>
  </div>
</main>

<footer>
  <div class="footer-content">
    <textarea id="input" rows="1" placeholder="Digite aqui se preferir..."></textarea>
    <button id="send" class="btn" onclick="enviar()">ENVIAR</button>
  </div>
</footer>

<script>
const WORKER_URL = 'https://boss-proxy.lexpaker.workers.dev'; 
const REPO_PROJETO = 'lexpaker-arch/EXODASH--Local'; 
const REPO_CONTEXTO = 'lexpaker-arch/BOSS-'; 

const MODELO = 'qwen/qwen3.8-27b';
let userRole = localStorage.getItem('boss_role') || 'Chefe';
let historico = [];
let contextoCache = { projetos: '', codigoReal: '' };
let exoContainer = document.getElementById('exoContainer');

document.getElementById('userDisplay').textContent = userRole;
document.getElementById('userSelect').value = userRole;

async function fetchGithubFile(repo, path) {
    try {
        const res = await fetch(`${WORKER_URL}/github?repo=${repo}&path=${path}`);
        const data = await res.json();
        if (data.content) return decodeURIComponent(escape(atob(data.content)));
        return '';
    } catch (e) { return ''; }
}

async function carregarContexto() {
  try {
    const [projetos, decisoes] = await Promise.all([
      fetchGithubFile(REPO_CONTEXTO, 'contexto/projetos.md'),
      fetchGithubFile(REPO_CONTEXTO, 'contexto/decisoes.md')
    ]);
    contextoCache.projetos = projetos + "\n" + decisoes;

    const [mainAct, obdSvc] = await Promise.all([
      fetchGithubFile(REPO_PROJETO, 'app/src/main/java/com/exodash/MainActivity.kt'),
      fetchGithubFile(REPO_PROJETO, 'app/src/main/java/com/exodash/ObdUsbService.kt')
    ]);
    
    if (mainAct && obdSvc) {
        contextoCache.codigoReal = `--- MainActivity.kt ---\n${mainAct}\n\n--- ObdUsbService.kt ---\n${obdSvc}`;
    } else {
        contextoCache.codigoReal = "Aviso: Não foi possível carregar o código-fonte.";
    }

    atualizarStatus(true);
  } catch (e) {
    atualizarStatus(false);
  }
}

function atualizarStatus(ok) {
  const el = document.getElementById('status');
  el.textContent = ok ? '● ONLINE' : '● OFFLINE';
  el.className = ok ? 'status ok' : 'status err';
}

function toggleConfig() { document.getElementById('config').classList.toggle('open'); }

function mudarUsuario() {
  userRole = document.getElementById('userSelect').value;
  localStorage.setItem('boss_role', userRole);
  document.getElementById('userDisplay').textContent = userRole;
  addMsg('boss', `Perfil alterado para ${userRole}.`);
}

function addMsg(tipo, texto) {
  const chat = document.getElementById('chat');
  const div = document.createElement('div');
  div.className = `msg ${tipo}`;
  div.textContent = texto;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return div;
}

function buildSystemPrompt() {
  let roleInstruction = "";
  if (userRole === "Chefe") roleInstruction = "O usuário é o Chefe, criador do sistema. Fale de forma técnica e direta.";
  else if (userRole === "Mecânico") roleInstruction = "O usuário é mecânico. Foque em diagnóstico prático, OBD, DTCs e peças.";
  else roleInstruction = "O usuário é um convidado. Seja educado e explique de forma simples.";

  return `Você é o BOSS, assistente dos projetos EXODASH e EXO VIGILANTE.
${roleInstruction}

=== CONTEXTO ===
${contextoCache.projetos}

=== CÓDIGO-FONTE ===
${contextoCache.codigoReal}`;
}

async function enviar() {
  const input = document.getElementById('input');
  const texto = input.value.trim();
  if (!texto) return;

  input.value = '';
  addMsg('user', texto);
  historico.push({ role: 'user', content: texto });

  const thinking = addMsg('thinking', 'BOSS processando...');
  document.getElementById('send').disabled = true;
  
  // Muda o Aro para o estado "Pensando"
  exoContainer.classList.remove('ouvindo', 'falando');
  exoContainer.classList.add('pensando');

  try {
    const messages = [
      { role: 'system', content: buildSystemPrompt() },
      ...historico.slice(-8) 
    ];

    const resp = await fetch(WORKER_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ model: MODELO, messages, max_tokens: 1000, temperature: 0.3 })
    });

    const data = await resp.json();
    
    let resposta;
    if (data.choices && data.choices[0] && data.choices[0].message) {
      resposta = data.choices[0].message.content.trim();
    } else if (data.error) {
      resposta = "⚠️ Erro: " + JSON.stringify(data.error);
    } else {
      resposta = "⚠️ Resposta inesperada do servidor.";
    }

    thinking.remove();
    addMsg('boss', resposta);
    historico.push({ role: 'assistant', content: resposta });

    // Muda o Aro para o estado "Falando"
    exoContainer.classList.remove('pensando');
    exoContainer.classList.add('falando');
    
    falarTexto(resposta);

  } catch (e) {
    thinking.remove();
    addMsg('error', `Erro de conexão: ${e.message}`);
    exoContainer.classList.remove('pensando');
  } finally {
    document.getElementById('send').disabled = false;
    input.focus();
  }
}

let reconhecimento;
let gravando = false;

function toggleGravacao() {
  if (gravando) {
    reconhecimento.stop();
    return;
  }

  if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
    alert("Seu navegador não suporta reconhecimento de voz.");
    return;
  }

  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  reconhecimento = new SpeechRecognition();
  reconhecimento.lang = 'pt-BR';
  reconhecimento.interimResults = false;

  reconhecimento.onstart = () => {
    gravando = true;
    exoContainer.classList.remove('pensando', 'falando');
    exoContainer.classList.add('ouvindo');
  };

  reconhecimento.onresult = (event) => {
    const texto = event.results[0][0].transcript;
    document.getElementById('input').value = texto;
    enviar();
  };

  reconhecimento.onend = () => {
    gravando = false;
    exoContainer.classList.remove('ouvindo');
  };

  reconhecimento.start();
}

function falarTexto(texto) {
  if (!('speechSynthesis' in window)) {
      exoContainer.classList.remove('falando');
      return;
  }
  window.speechSynthesis.cancel();
  const utterance = new SpeechSynthesisUtterance(texto);
  utterance.lang = 'pt-BR';
  const voices = window.speechSynthesis.getVoices();
  const ptVoice = voices.find(v => v.lang.includes('pt-BR'));
  if (ptVoice) utterance.voice = ptVoice;
  utterance.rate = 1.1;
  
  // Quando começar a falar, garante a classe
  utterance.onstart = () => {
      exoContainer.classList.remove('pensando');
      exoContainer.classList.add('falando');
  };
  
  // Quando terminar de falar, volta ao normal
  utterance.onend = () => {
      exoContainer.classList.remove('falando');
  };

  window.speechSynthesis.speak(utterance);
}

document.getElementById('input').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); enviar(); }
});

carregarContexto();
</script>
</body>
</html>
