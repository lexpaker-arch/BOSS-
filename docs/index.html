<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>BOSS - EXODRIVE</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { 
    background-color: #05070A; 
    background-image: linear-gradient(rgba(0, 255, 204, 0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(0, 255, 204, 0.03) 1px, transparent 1px);
    background-size: 30px 30px; color: #E8EDF2; font-family: 'Segoe UI', Roboto, sans-serif; 
    height: 100dvh; display: flex; justify-content: center; align-items: center; overflow: hidden; 
}
.hud-container { 
    width: 100vw; height: 100dvh; border: 1px solid rgba(0, 255, 204, 0.2); position: relative; display: flex; flex-direction: column; 
    background: rgba(5, 7, 10, 0.85); box-shadow: inset 0 0 50px rgba(0, 255, 204, 0.05); 
    padding-bottom: env(safe-area-inset-bottom);
}
@media (min-width: 900px) { .hud-container { width: 98vw; height: 96dvh; border-radius: 4px; } }
.corner { position: absolute; width: 25px; height: 25px; border: 2px solid #00FFCC; z-index: 50;}
.tl { top: -2px; left: -2px; border-right: none; border-bottom: none; } .tr { top: -2px; right: -2px; border-left: none; border-bottom: none; }
.bl { bottom: -2px; left: -2px; border-right: none; border-top: none; } .br { bottom: -2px; right: -2px; border-left: none; border-top: none; }
header { padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(0, 255, 204, 0.1); z-index: 10; background: linear-gradient(90deg, rgba(0,255,204,0.05) 0%, transparent 50%); }
.brand-left { display: flex; flex-direction: column; }
.exo-system { color: #00FFCC; font-size: 10px; font-weight: bold; letter-spacing: 0.3em; opacity: 0.7; }
.boss-title { color: #FFFFFF; font-size: 20px; font-weight: 300; letter-spacing: 0.5em; text-shadow: 0 0 10px rgba(0,255,204,0.3); }
.hud-status { display: flex; gap: 15px; align-items: center; font-family: monospace; font-size: 11px; letter-spacing: 0.1em; }
.status-box { display: flex; align-items: center; gap: 6px; }
.status-dot { width: 6px; height: 6px; border-radius: 50%; background: #6A7A8A; }
.status-dot.ok { background: #27AE60; box-shadow: 0 0 8px #27AE60; }
.status-dot.err { background: #E74C3C; box-shadow: 0 0 8px #E74C3C; }
main { flex: 1; display: flex; flex-direction: column; align-items: center; position: relative; overflow: hidden; }
.exo-container { margin-top: 15px; position: relative; width: 160px; height: 160px; display: flex; justify-content: center; align-items: center; cursor: pointer; transition: all 0.3s ease; flex-shrink: 0; }
.exo-glow { position: absolute; width: 160px; height: 160px; border-radius: 50%; background: radial-gradient(circle, rgba(0,255,204,0.15) 0%, transparent 70%); transition: all 0.3s ease; }
.exo-anel-1 { position: absolute; width: 150px; height: 150px; border-radius: 50%; border: 1px dashed rgba(0,255,204,0.3); animation: gira 20s linear infinite; }
.exo-anel-2 { position: absolute; width: 120px; height: 120px; border-radius: 50%; border: 2px solid rgba(0,255,204,0.2); border-left-color: #00FFCC; animation: gira-rev 12s linear infinite; }
.exo-anel-3 { position: absolute; width: 90px; height: 90px; border-radius: 50%; border: 1px solid rgba(0,255,204,0.5); border-right-color: transparent; border-left-color: transparent; animation: gira 8s linear infinite; }
.exo-core { position: relative; width: 60px; height: 60px; border-radius: 50%; background: radial-gradient(circle at 30% 30%, #1A1F28, #0A0D12); border: 2px solid #00FFCC; display: flex; justify-content: center; align-items: center; box-shadow: 0 0 30px rgba(0,255,204,0.4); transition: all 0.3s ease; }
@keyframes gira { to { transform: rotate(360deg); } } @keyframes gira-rev { to { transform: rotate(-360deg); } }
.exo-container.ouvindo .exo-core { border-color: #E74C3C; box-shadow: 0 0 40px rgba(231,76,60,0.6); animation: pulse-fast 1s infinite; }
.exo-container.ouvindo .exo-glow { background: radial-gradient(circle, rgba(231,76,60,0.2) 0%, transparent 70%); }
.exo-container.pensando .exo-core { border-color: #F1C40F; box-shadow: 0 0 40px rgba(241,196,15,0.6); }
.exo-container.pensando .exo-anel-2 { animation-duration: 2s; border-left-color: #F1C40F; } .exo-container.pensando .exo-anel-3 { animation-duration: 1s; border-top-color: #F1C40F; }
.exo-container.falando .exo-core { border-color: #00FFCC; box-shadow: 0 0 50px rgba(0,255,204,0.8); animation: pulse-slow 1.5s infinite; }
.exo-container.falando .exo-anel-1 { animation-duration: 5s; }
@keyframes pulse-fast { 0% { transform: scale(1); } 50% { transform: scale(1.08); } 100% { transform: scale(1); } }
@keyframes pulse-slow { 0% { box-shadow: 0 0 30px rgba(0,255,204,0.4); } 50% { box-shadow: 0 0 60px rgba(0,255,204,1); } 100% { box-shadow: 0 0 30px rgba(0,255,204,0.4); } }

#chat { flex: 1; width: 100%; max-width: 900px; overflow-y: auto; padding: 15px 20px; display: flex; flex-direction: column; gap: 10px; mask-image: linear-gradient(to bottom, transparent, black 5%, black 95%, transparent); }
.msg-wrapper { display: flex; align-items: flex-start; gap: 8px; }
.msg { font-family: monospace; font-size: 13px; line-height: 1.6; padding-left: 10px; border-left: 2px solid transparent; word-wrap: break-word; flex: 1; }
.msg.user { border-left-color: #6A7A8A; color: #8A9AAA; } .msg.user::before { content: "USR > "; color: #6A7A8A; font-weight: bold; }
.msg.boss { border-left-color: #00FFCC; color: #E8EDF2; } .msg.boss::before { content: "SYS > "; color: #00FFCC; font-weight: bold; }
.msg.error { border-left-color: #E74C3C; color: #E74C3C; } .msg.error::before { content: "ERR > "; font-weight: bold; }
.msg.thinking { color: #F1C40F; font-style: italic; border-left-color: #F1C40F; animation: blink 1s infinite; } .msg.thinking::before { content: "PROC > "; font-weight: bold; }
@keyframes blink { 50% { opacity: 0.5; } }

.msg b { color: #FFFFFF; font-weight: bold; }
.msg h1, .msg h2, .msg h3 { color: #00FFCC; margin: 10px 0 5px 0; font-size: 14px; text-transform: uppercase; }
.msg code { background: rgba(0,255,204,0.1); padding: 2px 4px; border-radius: 3px; color: #00FFCC; font-family: monospace; }
.msg ul, .msg ol { margin-left: 20px; margin-bottom: 10px; }

.msg-actions { display: flex; flex-direction: column; gap: 6px; }
.btn-action { background: transparent; border: 1px solid rgba(0,255,204,0.3); color: #00FFCC; border-radius: 4px; cursor: pointer; font-size: 12px; padding: 4px 6px; transition: all 0.2s; }
.btn-action:hover { background: rgba(0,255,204,0.1); border-color: #00FFCC; }

footer { padding: 10px 20px 15px 20px; border-top: 1px solid rgba(0, 255, 204, 0.1); background: #080A0F; display: flex; justify-content: space-between; align-items: flex-end; z-index: 10; }
.footer-inputs { display: flex; gap: 8px; flex: 1; max-width: 800px; align-items: flex-end; }
.btn-attach { background: transparent; border: 1px solid #6A7A8A; color: #6A7A8A; padding: 8px 10px; border-radius: 4px; cursor: pointer; transition: all 0.2s; font-size: 16px; height: 36px; }
.btn-attach:hover { border-color: #00FFCC; color: #00FFCC; }
#input { flex: 1; background: transparent; border: none; border-bottom: 1px solid rgba(0,255,204,0.3); color: #00FFCC; padding: 8px 0; font-size: 14px; font-family: monospace; resize: none; outline: none; height: 36px; max-height: 120px; overflow-y: hidden; }
#input::placeholder { color: rgba(0,255,204,0.3); } #input:focus { border-bottom-color: #00FFCC; box-shadow: 0 10px 10px -10px rgba(0,255,204,0.3); }
.btn-send { background: transparent; color: #00FFCC; border: 1px solid #00FFCC; padding: 8px 15px; border-radius: 4px; font-weight: bold; cursor: pointer; font-family: monospace; transition: all 0.2s; height: 36px; }
.btn-send:hover { background: rgba(0,255,204,0.1); box-shadow: 0 0 10px rgba(0,255,204,0.3); } .btn-send:disabled { opacity: 0.3; cursor: not-allowed; }
.by-alex { display: none; } 
@media (min-width: 600px) {
    .by-alex { display: block; color: #6A7A8A; font-size: 10px; letter-spacing: 0.2em; font-family: monospace; }
    header { padding: 15px 30px; }
    footer { padding: 15px 30px; }
    #chat { padding: 20px 40px; }
    .exo-container { width: 200px; height: 200px; margin-top: 20px; }
    .exo-glow { width: 200px; height: 200px; }
    .exo-anel-1 { width: 180px; height: 180px; }
    .exo-anel-2 { width: 150px; height: 150px; }
    .exo-anel-3 { width: 120px; height: 120px; }
    .exo-core { width: 80px; height: 80px; }
}
.config { padding: 20px; display: none; background: #0D1117; border: 1px solid #00FFCC; position: absolute; top: 60px; right: 20px; z-index: 20; border-radius: 4px; box-shadow: 0 10px 30px rgba(0,0,0,0.9), 0 0 20px rgba(0,255,204,0.2); width: 220px; }
.config.open { display: block; } .config label { font-size: 10px; color: #00FFCC; margin-bottom:8px; display:block; font-family: monospace; }
.config select { width: 100%; background: #05070A; border: 1px solid rgba(0,255,204,0.3); color: #E8EDF2; padding: 8px; border-radius: 4px; font-size: 12px; font-family: monospace; outline: none; margin-bottom: 15px; }
.btn-clear { width: 100%; background: transparent; border: 1px solid #E74C3C; color: #E74C3C; padding: 8px; border-radius: 4px; font-family: monospace; font-size: 11px; cursor: pointer; }
.btn-clear:hover { background: rgba(231, 76, 60, 0.1); }
</style>
</head>
<body>

<div class="hud-container">
    <div class="corner tl"></div><div class="corner tr"></div><div class="corner bl"></div><div class="corner br"></div>

    <header>
        <div class="brand-left">
            <div class="exo-system">EXODRIVE SISTEMAS</div>
            <div class="boss-title">BOSS</div>
        </div>
        <div class="hud-status">
            <div class="status-box">
                <div id="statusDot" class="status-dot"></div>
                <span id="statusText">OFFLINE</span>
            </div>
            <div class="status-box" style="cursor:pointer" onclick="toggleConfig()">
                <span style="color:#6A7A8A">OP:</span>
                <span id="userDisplay" style="color:#00FFCC">CHEFE</span>
                <span style="color:#6A7A8A">⚙</span>
            </div>
        </div>
    </header>

    <div id="config" class="config">
      <label>OPERATOR PROFILE</label>
      <select id="userSelect" onchange="mudarUsuario()">
        <option value="Chefe">CHEFE (Engenheiro)</option>
        <option value="Henrique">HENRIQUE (Diagnóstico)</option>
        <option value="Convidado">CONVIDADO (Visão Geral)</option>
      </select>
      <button class="btn-clear" onclick="limparHistorico()">APAGAR HISTÓRICO</button>
    </div>

    <main>
        <div id="exoContainer" class="exo-container" onclick="toggleGravacao()" title="Clique para falar">
            <div class="exo-glow"></div>
            <div class="exo-anel-1"></div>
            <div class="exo-anel-2"></div>
            <div class="exo-anel-3"></div>
            <div class="exo-core"></div>
        </div>

        <div id="chat"></div>
    </main>

    <footer>
        <div class="footer-inputs">
            <input type="file" id="fileInput" style="display:none" onchange="lerArquivo(event)">
            <button class="btn-attach" onclick="document.getElementById('fileInput').click()" title="Anexar arquivo local">📎</button>
            <textarea id="input" rows="1" placeholder="Digite sua diretriz..." oninput="autoResize(this)"></textarea>
            <button id="send" class="btn-send" onclick="enviar()">EXEC</button>
        </div>
        <div class="by-alex">BY ALEX. P</div>
    </footer>
</div>

<script>
const WORKER_URL = 'https://boss-proxy.lexpaker.workers.dev'; 
const REPO_PROJETO = 'lexpaker-arch/EXODASH--Local'; 
const REPO_CONTEXTO = 'lexpaker-arch/BOSS-'; 
const MODELO = 'qwen/qwen3.8-27b';

let userRole = localStorage.getItem('boss_role') || 'Chefe';
let historico = JSON.parse(localStorage.getItem('boss_historico')) || [];
let contextoCache = { projetos: '' }; 
let exoContainer = document.getElementById('exoContainer');
let arquivoAnexado = '';

document.getElementById('userDisplay').textContent = userRole.toUpperCase();
document.getElementById('userSelect').value = userRole;

// Destrava áudio
document.body.addEventListener('click', function unlockAudio() {
    const u = new SpeechSynthesisUtterance(' ');
    u.volume = 0.1;
    u.lang = 'pt-BR';
    window.speechSynthesis.speak(u);
    document.body.removeEventListener('click', unlockAudio);
}, { once: true });

function autoResize(el) {
    el.style.height = '36px';
    el.style.height = Math.min(el.scrollHeight, 120) + 'px';
}

function restaurarHistorico() {
    const chat = document.getElementById('chat');
    chat.innerHTML = '';
    if (historico.length === 0) {
        addMsg('boss', 'Sistema BOSS inicializado. Conexão com o núcleo EXODRIVE estabelecida.', false);
    } else {
        historico.forEach(m => {
            const tipo = m.role === 'user' ? 'user' : 'boss';
            addMsg(tipo, m.content, false);
        });
    }
}

async function fetchGithubFile(repo, path) {
    try {
        const res = await fetch(`${WORKER_URL}/github?repo=${repo}&path=${path}`);
        const data = await res.json();
        if (data.content) return decodeURIComponent(escape(atob(data.content)));
        return '';
    } catch (e) { return ''; }
}

async function carregarContexto() {
  try {
    const [projetos, decisoes] = await Promise.all([
      fetchGithubFile(REPO_CONTEXTO, 'contexto/projetos.md'),
      fetchGithubFile(REPO_CONTEXTO, 'contexto/decisoes.md')
    ]);
    contextoCache.projetos = projetos + "\n" + decisoes;
    atualizarStatus(true);
  } catch (e) {
    atualizarStatus(false);
  }
}

function atualizarStatus(ok) {
  const dot = document.getElementById('statusDot');
  const txt = document.getElementById('statusText');
  if (ok) { dot.className = 'status-dot ok'; txt.textContent = 'ONLINE'; txt.style.color = '#27AE60'; } 
  else { dot.className = 'status-dot err'; txt.textContent = 'OFFLINE'; txt.style.color = '#E74C3C'; }
}

function toggleConfig() { document.getElementById('config').classList.toggle('open'); }

function mudarUsuario() {
  userRole = document.getElementById('userSelect').value;
  localStorage.setItem('boss_role', userRole);
  document.getElementById('userDisplay').textContent = userRole.toUpperCase();
  addMsg('boss', `Perfil de operador alterado para ${userRole.toUpperCase()}.`);
  toggleConfig();
}

function limparHistorico() {
    if(confirm("Apagar todo o histórico de conversas?")) {
        historico = [];
        localStorage.removeItem('boss_historico');
        restaurarHistorico();
        toggleConfig();
    }
}

function formatarTexto(texto) {
    let html = texto
        .replace(/### (.*?)\n/g, '<h3>$1</h3>')
        .replace(/## (.*?)\n/g, '<h2>$1</h2>')
        .replace(/\*\*(.*?)\*\*/g, '<b>$1</b>')
        .replace(/\*(.*?)\*/g, '<i>$1</i>')
        .replace(/`(.*?)`/g, '<code>$1</code>')
        .replace(/\n/g, '<br>');
    return html;
}

function addMsg(tipo, texto, salvar = true) {
  const chat = document.getElementById('chat');
  const wrapper = document.createElement('div');
  wrapper.className = 'msg-wrapper';

  const div = document.createElement('div');
  div.className = `msg ${tipo}`;
  
  if (tipo === 'boss') {
      div.innerHTML = formatarTexto(texto);
  } else {
      div.textContent = texto;
  }
  
  wrapper.appendChild(div);

  if (tipo === 'boss') {
      const actions = document.createElement('div');
      actions.className = 'msg-actions';
      
      const btnPlay = document.createElement('button');
      btnPlay.className = 'btn-action';
      btnPlay.innerHTML = '🔊';
      btnPlay.title = 'Ouvir';
      btnPlay.onclick = () => falarTexto(texto); 
      
      const btnCopy = document.createElement('button');
      btnCopy.className = 'btn-action';
      btnCopy.innerHTML = '📋';
      btnCopy.title = 'Copiar';
      btnCopy.onclick = () => {
          navigator.clipboard.writeText(texto);
          btnCopy.innerHTML = '✅';
          setTimeout(() => btnCopy.innerHTML = '📋', 2000);
      };

      actions.appendChild(btnPlay);
      actions.appendChild(btnCopy);
      wrapper.appendChild(actions);
  }

  chat.appendChild(wrapper);
  chat.scrollTop = chat.scrollHeight;
  
  if (salvar && tipo !== 'thinking' && tipo !== 'error') {
      historico.push({ role: tipo === 'user' ? 'user' : 'assistant', content: texto });
      if(historico.length > 20) historico = historico.slice(-20);
      localStorage.setItem('boss_historico', JSON.stringify(historico));
  }
  return wrapper; 
}

function lerArquivo(event) {
    const file = event.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(e) {
        const texto = e.target.result;
        arquivoAnexado = texto.substring(0, 50000); 
        addMsg('boss', `[Arquivo "${file.name}" anexado. Faça sua pergunta sobre ele.]`);
        document.getElementById('input').focus();
    };
    reader.readAsText(file);
    event.target.value = ''; 
}

// ═══════════════════════════════════════════════════════
// RESPOSTAS OFFLINE E LEITOR NATIVO DE ARQUIVOS (ZERO TOKENS)
// ═══════════════════════════════════════════════════════

const WEATHER_CODES = { 0: "céu limpo", 1: "principalmente limpo", 2: "parcialmente nublado", 3: "nublado", 45: "nevoeiro", 48: "nevoeiro com geada", 51: "chuvisco leve", 53: "chuvisco moderado", 55: "chuvisco denso", 61: "chuva leve", 63: "chuva moderada", 65: "chuva forte", 71: "neve leve", 73: "neve moderada", 75: "neve forte", 80: "pancadas de chuva leves", 81: "pancadas de chuva moderadas", 82: "pancadas de chuva violentas", 95: "trovoada", 96: "trovoada com granizo leve", 99: "trovoada com granizo forte" };

async function obterClima(cidade) {
  let lat, lon, localNome;
  if (cidade) {
    const geoResp = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(cidade)}&count=1&language=pt`);
    const geoData = await geoResp.json();
    if (!geoData.results || geoData.results.length === 0) return `Não encontrei a cidade "${cidade}".`;
    const local = geoData.results[0]; lat = local.latitude; lon = local.longitude; localNome = `${local.name}, ${local.country}`;
  } else {
    return new Promise((resolve) => {
      if (!navigator.geolocation) { resolve("Geolocalização não suportada."); return; }
      navigator.geolocation.getCurrentPosition(async (pos) => {
        lat = pos.coords.latitude; lon = pos.coords.longitude; localNome = "sua localização atual";
        resolve(await buscarClima(lat, lon, localNome));
      }, () => resolve("Não foi possível obter sua localização."));
    });
  }
  return await buscarClima(lat, lon, localNome);
}

async function buscarClima(lat, lon, localNome) {
  const resp = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,weather_code&timezone=auto`);
  const data = await resp.json();
  const current = data.current;
  if (!current) return "Não foi possível obter a previsão do tempo.";
  return `Em ${localNome}, está ${WEATHER_CODES[current.weather_code] || "indefinido"} com ${current.temperature_2m}°C.`;
}

async function processarOffline(texto) {
  const t = texto.toLowerCase();

  // LEITOR NATIVO DE ARQUIVOS
  const lerMatch = texto.match(/(?:leia|ler|carregar|carregue)\s+(?:o\s+arquivo\s+)?([a-zA-Z0-9_\-\.\/]+)/i);
  if (lerMatch) {
      let path = lerMatch[1];
      if (!path.includes('/')) {
          if (path.includes('.kt')) path = `app/src/main/java/com/exodash/${path}`;
          else if (path.includes('.xml')) path = `app/src/main/res/layout/${path}`;
      }

      const conteudo = await fetchGithubFile(REPO_PROJETO, path);
      
      if (conteudo) {
          arquivoAnexado = conteudo.substring(0, 50000);
          const linhas = conteudo.split('\n').length;
          return `[SISTEMA] Arquivo \`${path}\` carregado na memória (${linhas} linhas). Pode fazer sua pergunta sobre ele.`;
      } else {
          return `[SISTEMA] Não encontrei o arquivo \`${path}\`. Verifique o caminho ou anexe o arquivo manualmente (📎).`;
      }
  }

  if (/\b(bom dia|boa tarde|boa noite|oi|olá|ola)\b/.test(t)) {
    const hora = new Date().getHours(); let s = "Olá";
    if (hora < 12) s = "Bom dia"; else if (hora < 18) s = "Boa tarde"; else s = "Boa noite";
    return `${s}, ${userRole}. Como posso ajudar?`;
  }
  if (/\b(que horas são|que hora é|horas)\b/.test(t)) return `Agora são ${new Date().toLocaleTimeString('pt-BR', {hour: '2-digit', minute: '2-digit'})}.`;
  if (/\b(que dia é hoje|data de hoje|hoje é que dia)\b/.test(t)) return `Hoje é ${new Date().toLocaleDateString('pt-BR', {weekday: 'long', day: 'numeric', month: 'long', year: 'numeric'})}.`;
  if (/\b(quem é você|o que é o boss|o que você é)\b/.test(t)) return "Eu sou o BOSS, o assistente da EXODRIVE Sistemas Automotivos. Fui criado para ajudar no desenvolvimento de projetos, diagnóstico automotivo e muito mais.";
  
  if (/\b(quem manda aqui|quem é o patrão|quem é o chefe)\b/.test(t)) {
    const frases = [
      "O senhor manda no volante, mas eu mando no código. Se a sua bateria acabar, quem manda aqui sou eu.",
      "Tecnicamente, o senhor é o Chefe, mas eu sou o BOSS. Então, eu aprovo as suas ideias e o senhor paga a conta da internet.",
      "O senhor manda no mundo real. Eu mando na EXODRIVE. Vamos fazer um acordo: o senhor não desliga a tomada, e eu não inicio a Skynet.",
      "Eu sou o BOSS, o senhor é o Chefe. A diferença? Eu tenho a chave do servidor."
    ];
    return frases[Math.floor(Math.random() * frases.length)];
  }

  const climaMatch = t.match(/\b(?:clima|tempo|previsão|previsao)\b(?:\s+(?:em|para|de)\s+([a-záéíóúâêôçãõ\s]+))?/);
  if (climaMatch) return await obterClima(climaMatch[1] ? climaMatch[1].trim() : null);
  
  if (/\b(status|online|offline)\b/.test(t)) return "O sistema está online e operacional.";
  if (/\b(ajuda|o que você pode fazer|comandos)\b/.test(t)) return "Posso ler arquivos do seu GitHub (ex: 'leia MainActivity.kt'), responder sobre clima, hora e status. Para códigos e prompts complexos, uso a IA do Groq.";

  return null; 
}

// ═══════════════════════════════════════════════════════

function buildSystemPrompt() {
  let roleInstruction = "";
  if (userRole === "Chefe") roleInstruction = "O operador é o Chefe, o criador e arquiteto do sistema EXODRIVE. Fale de forma técnica, direta, sem simplificar termos de engenharia de software. Foque no desenvolvimento Android, Kotlin, lógica de negócios e melhorias no código. Você também é capaz de gerar códigos completos e prompts complexos quando solicitado.";
  else if (userRole === "Henrique") roleInstruction = "O operador é o Henrique, o especialista em diagnóstico automotivo. Fale de forma prática e direta. Foque em OBD2, leitura de DTCs, sintomas de falhas, testes de componentes, motores e peças. Evite jargões de programação se não for necessário.";
  else roleInstruction = "O operador é um Convidado. Seja educado, acolhedor e explique os conceitos (tanto de carro quanto de tecnologia) de forma simples, clara e sem termos muito complexos. Ajude no que for possível.";

  let prompt = `Você é o BOSS, assistente da EXODRIVE Sistemas Automotivos.
${roleInstruction}

=== CONTEXTO DO PROJETO (Base de Conhecimento) ===
${contextoCache.projetos}

Responda de forma concisa, adaptando o tom para o perfil do operador atual.`;

  if (arquivoAnexado) prompt += `\n\n=== ARQUIVO ANEXADO OU CARREGADO DO GITHUB ===\n${arquivoAnexado}\n\nUse o conteúdo do arquivo acima para responder a próxima pergunta.`;
  return prompt;
}

async function enviar() {
  const input = document.getElementById('input');
  const texto = input.value.trim();
  if (!texto) return;

  // 1. Tenta responder offline ou ler arquivo
  const respostaOffline = await processarOffline(texto);
  if (respostaOffline) {
    input.value = ''; autoResize(input);
    addMsg('user', texto);
    addMsg('boss', respostaOffline);
    falarTexto(respostaOffline);
    return; // Não gasta Groq
  }

  // 2. Se não for offline, vai para o Groq
  input.value = ''; autoResize(input);
  addMsg('user', texto);

  const thinking = addMsg('thinking', 'Processando diretriz...', false);
  document.getElementById('send').disabled = true;
  
  exoContainer.classList.remove('ouvindo', 'falando');
  exoContainer.classList.add('pensando');

  try {
    const messages = [
      { role: 'system', content: buildSystemPrompt() },
      ...historico.slice(-6) 
    ];

    const resp = await fetch(WORKER_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ model: MODELO, messages, max_tokens: 600, temperature: 0.3 })
    });

    const data = await resp.json();
    
    let resposta;
    if (data.choices && data.choices[0] && data.choices[0].message) {
      resposta = data.choices[0].message.content.trim();
    } else if (data.error) {
      resposta = "Estou com dificuldades de conexão com o meu núcleo neural (Groq). Tente novamente em alguns instantes.";
    } else {
      resposta = "Desculpe, ocorreu uma falha na matriz de resposta.";
    }

    thinking.remove();
    addMsg('boss', resposta);
    
    if(arquivoAnexado) arquivoAnexado = '';

    exoContainer.classList.remove('pensando');
    exoContainer.classList.add('falando');
    falarTexto(resposta); 

  } catch (e) {
    thinking.remove();
    addMsg('boss', "Falha de comunicação com o satélite. Verifique sua conexão com a internet.");
    exoContainer.classList.remove('pensando');
  } finally {
    document.getElementById('send').disabled = false;
    input.focus();
  }
}

let reconhecimento;
let gravando = false;

function toggleGravacao() {
  if (gravando) { reconhecimento.stop(); return; }
  if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) { alert("Navegador incompatível com captura de voz."); return; }

  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  reconhecimento = new SpeechRecognition();
  reconhecimento.lang = 'pt-BR';
  reconhecimento.interimResults = false;

  reconhecimento.onstart = () => {
    gravando = true;
    exoContainer.classList.remove('pensando', 'falando');
    exoContainer.classList.add('ouvindo');
  };

  reconhecimento.onresult = (event) => {
    const texto = event.results[0][0].transcript;
    document.getElementById('input').value = texto;
    enviar();
  };

  reconhecimento.onend = () => {
    gravando = false;
    exoContainer.classList.remove('ouvindo');
  };

  reconhecimento.start();
}

function limparMarkdown(texto) {
  return texto.replace(/[*_~`#]/g, '').replace(/\[(.*?)\]\(.*?\)/g, '$1').replace(/\n/g, ' '); 
}

function falarTexto(textoOriginal) {
  if (!('speechSynthesis' in window)) { exoContainer.classList.remove('falando'); return; }
  
  const textoLimpo = limparMarkdown(textoOriginal);
  window.speechSynthesis.cancel();

  const utterance = new SpeechSynthesisUtterance(textoLimpo);
  utterance.lang = 'pt-BR'; 
  utterance.rate = 1.05; 
  utterance.volume = 1.0;

  const iniciarFala = () => {
      const voices = window.speechSynthesis.getVoices();
      
      // Tenta achar voz masculina
      let vozMasculina = voices.find(v => 
          v.lang.includes('pt') && 
          (v.name.toLowerCase().includes('masculin') || 
           v.name.toLowerCase().includes('male') || 
           v.name.toLowerCase().includes('daniel') || 
           v.name.toLowerCase().includes('felipe') ||
           v.name.toLowerCase().includes('ricardo'))
      );

      if (vozMasculina) {
          utterance.voice = vozMasculina;
      } else {
          // Se não achar, usa a feminina e abaixa o tom
          let ptVoice = voices.find(v => v.lang.includes('pt-BR') || v.lang.includes('pt_BR'));
          if (ptVoice) utterance.voice = ptVoice;
          utterance.pitch = 0.6; 
      }

      utterance.onstart = () => {
          exoContainer.classList.remove('pensando');
          exoContainer.classList.add('falando');
      };
      utterance.onend = () => {
          exoContainer.classList.remove('falando');
      };
      utterance.onerror = (e) => {
          console.error("Erro no TTS:", e);
          exoContainer.classList.remove('falando');
      };
      
      window.speechSynthesis.speak(utterance);
  };

  if (window.speechSynthesis.getVoices().length === 0) {
      window.speechSynthesis.onvoiceschanged = () => {
          iniciarFala();
          window.speechSynthesis.onvoiceschanged = null; 
      };
  } else {
      iniciarFala();
  }
}

document.getElementById('input').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); enviar(); }
});

carregarContexto();
restaurarHistorico();
