<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>BOSS - EXODRIVE</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background-color: #05070A; background-image: linear-gradient(rgba(0, 255, 204, 0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(0, 255, 204, 0.03) 1px, transparent 1px); background-size: 30px 30px; color: #E8EDF2; font-family: 'Segoe UI', Roboto, sans-serif; height: 100dvh; display: flex; justify-content: center; align-items: center; overflow: hidden; }
.hud-container { width: 100vw; height: 100dvh; border: 1px solid rgba(0, 255, 204, 0.2); position: relative; display: flex; flex-direction: column; background: rgba(5, 7, 10, 0.85); box-shadow: inset 0 0 50px rgba(0, 255, 204, 0.05); padding-bottom: env(safe-area-inset-bottom); transition: all 0.3s; }
@media (min-width: 900px) { .hud-container { width: 98vw; height: 96dvh; border-radius: 4px; } }
.corner { position: absolute; width: 25px; height: 25px; border: 2px solid #00FFCC; z-index: 50;}
.tl { top: -2px; left: -2px; border-right: none; border-bottom: none; } .tr { top: -2px; right: -2px; border-left: none; border-bottom: none; }
.bl { bottom: -2px; left: -2px; border-right: none; border-top: none; } .br { bottom: -2px; right: -2px; border-left: none; border-top: none; }

header { padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(0, 255, 204, 0.1); z-index: 10; background: linear-gradient(90deg, rgba(0,255,204,0.05) 0%, transparent 50%); transition: 0.3s; position: relative; flex-shrink: 0; }
.brand-left { display: flex; flex-direction: column; }
.exo-system { color: #00FFCC; font-size: 10px; font-weight: bold; letter-spacing: 0.3em; opacity: 0.7; }
.brand-center { position: absolute; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; }
.boss-title { color: #FFFFFF; font-size: 20px; font-weight: 900; letter-spacing: 0.5em; text-shadow: 0 0 10px rgba(0,255,204,0.3); }
.hud-status { display: flex; gap: 10px; align-items: center; font-family: monospace; font-size: 11px; letter-spacing: 0.1em; }
.status-box { display: flex; align-items: center; gap: 6px; }
.status-dot { width: 6px; height: 6px; border-radius: 50%; background: #6A7A8A; }
.status-dot.ok { background: #27AE60; box-shadow: 0 0 8px #27AE60; }
.hud-btn { background: transparent; border: 1px solid rgba(0,255,204,0.3); color: #00FFCC; border-radius: 4px; cursor: pointer; font-size: 13px; padding: 3px 7px; transition: all 0.2s; }
.hud-btn:hover { background: rgba(0,255,204,0.15); border-color: #00FFCC; }
.hud-btn.alert { border-color: #F1C40F; color: #F1C40F; }

.hud-container.zen-mode .side-hud { display: none !important; }
.hud-container.zen-mode .exo-container { display: none !important; }

main { flex: 1; display: flex; flex-direction: row; position: relative; overflow: hidden; transition: 0.3s; width: 100%; height: 100%; min-height: 0; }
.chat-area { flex: 1; display: flex; flex-direction: column; align-items: center; position: relative; overflow: hidden; height: 100%; min-height: 0; }
.side-hud { display: none; width: 260px; background: rgba(13, 17, 23, 0.9); border-right: 1px solid rgba(0, 255, 204, 0.2); padding: 20px; flex-direction: column; gap: 15px; font-family: monospace; order: -1; overflow-y: auto; flex-shrink: 0; }
@media (min-width: 900px) { .side-hud { display: flex; } }
.hud-widget { border: 1px solid rgba(0,255,204,0.1); background: #05070A; border-radius: 6px; padding: 12px; }
.hud-widget-title { font-size: 10px; color: #6A7A8A; letter-spacing: 0.1em; margin-bottom: 8px; border-bottom: 1px solid rgba(0,255,204,0.1); padding-bottom: 4px; }
.hud-widget-val { font-size: 20px; color: #00FFCC; font-weight: bold; text-shadow: 0 0 10px rgba(0,255,204,0.3); }
.hud-widget-sub { font-size: 11px; color: #E8EDF2; margin-top: 4px; }
.hud-widget-btn { width: 100%; margin-top: 8px; background: transparent; border: 1px solid rgba(0,255,204,0.3); color: #00FFCC; padding: 4px; border-radius: 4px; cursor: pointer; font-size: 11px; font-family: monospace; }
.hud-widget-btn:hover { background: rgba(0,255,204,0.1); }

.exo-container { margin-top: 15px; position: relative; width: 140px; height: 140px; display: flex; justify-content: center; align-items: center; cursor: pointer; transition: all 0.3s ease; flex-shrink: 0; }
.exo-glow { position: absolute; width: 140px; height: 140px; border-radius: 50%; background: radial-gradient(circle, rgba(0,255,204,0.15) 0%, transparent 70%); transition: all 0.3s ease; }
.exo-anel-1 { position: absolute; width: 130px; height: 130px; border-radius: 50%; border: 1px dashed rgba(0,255,204,0.3); animation: gira 20s linear infinite; }
.exo-anel-2 { position: absolute; width: 100px; height: 100px; border-radius: 50%; border: 2px solid rgba(0,255,204,0.2); border-left-color: #00FFCC; animation: gira-rev 12s linear infinite; }
.exo-anel-3 { position: absolute; width: 70px; height: 70px; border-radius: 50%; border: 1px solid rgba(0,255,204,0.5); border-right-color: transparent; border-left-color: transparent; animation: gira 8s linear infinite; }
.exo-core { position: relative; width: 50px; height: 50px; border-radius: 50%; background: radial-gradient(circle at 30% 30%, #1A1F28, #0A0D12); border: 2px solid #00FFCC; display: flex; justify-content: center; align-items: center; box-shadow: 0 0 30px rgba(0,255,204,0.4); transition: all 0.3s ease; }
@keyframes gira { to { transform: rotate(360deg); } } @keyframes gira-rev { to { transform: rotate(-360deg); } }
.exo-container.ouvindo .exo-core { border-color: #E74C3C; box-shadow: 0 0 40px rgba(231,76,60,0.6); animation: pulse-fast 1s infinite; }
.exo-container.pensando .exo-core { border-color: #F1C40F; box-shadow: 0 0 40px rgba(241,196,15,0.6); }
.exo-container.pensando .exo-anel-2 { animation-duration: 2s; border-left-color: #F1C40F; } .exo-container.pensando .exo-anel-3 { animation-duration: 1s; border-top-color: #F1C40F; }
.exo-container.falando .exo-core { border-color: #00FFCC; box-shadow: 0 0 50px rgba(0,255,204,0.8); animation: pulse-slow 1.5s infinite; }
@keyframes pulse-fast { 0% { transform: scale(1); } 50% { transform: scale(1.08); } 100% { transform: scale(1); } }
@keyframes pulse-slow { 0% { box-shadow: 0 0 30px rgba(0,255,204,0.4); } 50% { box-shadow: 0 0 60px rgba(0,255,204,1); } 100% { box-shadow: 0 0 30px rgba(0,255,204,0.4); } }

#chat { flex: 1; width: 100%; max-width: 900px; overflow-y: auto; overflow-x: hidden; padding: 15px 25px 15px 20px; display: flex; flex-direction: column; gap: 10px; transition: 0.3s; scroll-behavior: smooth; min-height: 0; overflow-anchor: none; }
#chat::-webkit-scrollbar { width: 8px; }
#chat::-webkit-scrollbar-track { background: transparent; }
#chat::-webkit-scrollbar-thumb { background: rgba(0, 255, 204, 0.3); border-radius: 4px; }

.msg-wrapper { display: flex; align-items: flex-start; gap: 8px; width: 100%; }
.msg { font-family: monospace; font-size: 13px; line-height: 1.6; padding-left: 10px; border-left: 2px solid transparent; word-wrap: break-word; white-space: pre-wrap; flex: 1; transition: 0.3s; }
.msg.user { border-left-color: #6A7A8A; color: #8A9AAA; } .msg.user::before { content: "USR > "; color: #6A7A8A; font-weight: bold; }
.msg.boss { border-left-color: #00FFCC; color: #E8EDF2; } .msg.boss::before { content: "SYS > "; color: #00FFCC; font-weight: bold; }
.msg.error { border-left-color: #E74C3C; color: #E74C3C; } .msg.error::before { content: "ERR > "; font-weight: bold; }
.msg.thinking { color: #F1C40F; font-style: italic; border-left-color: #F1C40F; animation: blink 1s infinite; } .msg.thinking::before { content: "PROC > "; font-weight: bold; }
@keyframes blink { 50% { opacity: 0.5; } }
.msg b { color: #FFFFFF; font-weight: bold; }
.msg pre { background: #0D1117; padding: 10px; border-radius: 6px; overflow-x: auto; border: 1px solid rgba(0,255,204,0.2); position: relative; margin-top: 10px; white-space: pre; }
.msg pre code { background: transparent; color: #E8EDF2; font-family: 'Consolas', 'Monaco', monospace; font-size: 12px; }
.btn-copy-code { position: absolute; top: 5px; right: 5px; background: #1E293B; color: #00FFCC; border: 1px solid #00FFCC; border-radius: 4px; padding: 2px 6px; font-size: 10px; cursor: pointer; }
.btn-copy-code:hover { background: #00FFCC; color: #000; }

footer { padding: 15px 20px; border-top: 1px solid rgba(0, 255, 204, 0.1); background: #080A0F; display: flex; justify-content: flex-start; align-items: center; z-index: 10; transition: 0.3s; width: 100%; position: relative; flex-shrink: 0; }
.footer-inputs { display: flex; gap: 8px; width: 100%; max-width: 900px; align-items: center; justify-content: flex-start; margin-left: 0; margin-top: 15px; }
@media (min-width: 1200px) { .footer-inputs { margin-left: 280px; margin-top: 0; } }
@media (min-width: 900px) and (max-width: 1199px) { .footer-inputs { margin-left: 40px; } }

.btn-attach { background: transparent; border: 1px solid #6A7A8A; color: #6A7A8A; padding: 8px 10px; border-radius: 4px; cursor: pointer; transition: all 0.2s; font-size: 16px; height: 40px; display: flex; align-items: center; justify-content: center; }
.btn-attach:hover { border-color: #00FFCC; color: #00FFCC; }
#input { flex: 1; background: transparent; border: none; border-bottom: 1px solid rgba(0,255,204,0.3); color: #00FFCC; padding: 8px 0; font-size: 14px; font-family: monospace; resize: none; outline: none; height: 40px; max-height: 120px; overflow-y: hidden; transition: 0.3s; }
#input::placeholder { color: rgba(0,255,204,0.3); } #input:focus { border-bottom-color: #00FFCC; }
.btn-send { background: transparent; color: #00FFCC; border: 1px solid #00FFCC; padding: 8px 20px; border-radius: 4px; font-weight: bold; cursor: pointer; font-family: monospace; transition: all 0.2s; height: 40px; }
.btn-send:hover { background: rgba(0,255,204,0.1); } .btn-send:disabled { opacity: 0.3; cursor: not-allowed; }

.config { padding: 20px; display: none; background: #0D1117; border: 1px solid #00FFCC; position: absolute; top: 60px; right: 20px; z-index: 20; border-radius: 4px; box-shadow: 0 10px 30px rgba(0,0,0,0.9), 0 0 20px rgba(0,255,204,0.2); width: 300px; max-height: 80vh; overflow-y: auto; }
.config.open { display: block; }
.config label { font-size: 10px; color: #00FFCC; margin-bottom:6px; display:block; font-family: monospace; margin-top: 12px; }
.config select, .config input[type=range] { width: 100%; background: #05070A; border: 1px solid rgba(0,255,204,0.3); color: #E8EDF2; padding: 8px; border-radius: 4px; font-size: 12px; font-family: monospace; outline: none; margin-bottom: 5px; }
.config .range-val { font-size: 11px; color: #64748B; text-align: right; margin-bottom: 5px; }
.btn-clear { width: 100%; background: transparent; border: 1px solid #E74C3C; color: #E74C3C; padding: 8px; border-radius: 4px; font-family: monospace; font-size: 11px; cursor: pointer; margin-top: 15px;}
.btn-save { width: 100%; background: transparent; border: 1px solid #00FFCC; color: #00FFCC; padding: 8px; border-radius: 4px; font-family: monospace; font-size: 11px; cursor: pointer; margin-bottom: 8px; }

.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 100; display: none; justify-content: center; align-items: center; padding: 20px; }
.modal-overlay.open { display: flex; }
.modal-box { background: #0D1117; border: 1px solid #00FFCC; border-radius: 6px; width: 100%; max-width: 820px; max-height: 90vh; display: flex; flex-direction: column; }
.modal-header { padding: 12px 18px; border-bottom: 1px solid rgba(0,255,204,0.2); display: flex; justify-content: space-between; align-items: center; }
.modal-title { color: #00FFCC; font-family: monospace; font-size: 13px; letter-spacing: 0.15em; }
.modal-close { background: transparent; border: none; color: #E74C3C; font-size: 20px; cursor: pointer; }
.modal-body { padding: 18px; overflow-y: auto; flex: 1; }

.tabs { display: flex; gap: 4px; border-bottom: 1px solid rgba(0,255,204,0.2); margin-bottom: 15px; }
.tab { background: transparent; border: 1px solid transparent; color: #6A7A8A; padding: 8px 14px; font-family: monospace; font-size: 12px; cursor: pointer; border-bottom: none; }
.tab.active { color: #00FFCC; border-color: rgba(0,255,204,0.3); background: rgba(0,255,204,0.05); }
.tab-content { display: none; } .tab-content.active { display: block; }

.calc-card { border: 1px solid rgba(0,255,204,0.15); border-radius: 6px; padding: 14px; background: #05070A; }
.calc-card h4 { color: #00FFCC; font-family: monospace; font-size: 12px; margin-bottom: 10px; }
.calc-card label { display: block; font-family: monospace; font-size: 11px; color: #8A9AAA; margin-top: 8px; }
.calc-card input { width: 100%; background: #0D1117; border: 1px solid rgba(0,255,204,0.2); color: #E8EDF2; padding: 6px 8px; border-radius: 4px; font-family: monospace; font-size: 12px; margin-top: 3px; }
.calc-btn { margin-top: 10px; width: 100%; background: rgba(0,255,204,0.1); border: 1px solid #00FFCC; color: #00FFCC; padding: 7px; border-radius: 4px; font-family: monospace; font-size: 12px; cursor: pointer; }
.calc-result { margin-top: 10px; padding: 10px; border-radius: 4px; background: rgba(0,255,204,0.05); border: 1px solid rgba(0,255,204,0.2); color: #00FFCC; font-family: monospace; font-size: 12px; white-space: pre-wrap; }
.ref-table { width: 100%; border-collapse: collapse; font-family: monospace; font-size: 11px; }
.ref-table th { background: rgba(0,255,204,0.1); color: #00FFCC; padding: 6px 8px; text-align: left; }
.ref-table td { padding: 5px 8px; border-bottom: 1px solid rgba(0,255,204,0.08); color: #E8EDF2; }
.search-input { width: 100%; background: #05070A; border: 1px solid rgba(0,255,204,0.3); color: #E8EDF2; padding: 8px; border-radius: 4px; font-family: monospace; font-size: 13px; margin-bottom: 12px; outline: none; }

.measure-item { border: 1px solid rgba(0,255,204,0.15); border-radius: 6px; padding: 10px; margin-bottom: 8px; background: #05070A; display: flex; justify-content: space-between; align-items: center; }
.measure-info { flex: 1; font-family: monospace; font-size: 12px; }
.measure-point { color: #00FFCC; font-weight: bold; } .measure-val { color: #F1C40F; font-size: 14px; }
.measure-form { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 15px; padding: 12px; border: 1px dashed rgba(0,255,204,0.3); border-radius: 6px; }
.measure-form input, .measure-form select { background: #05070A; border: 1px solid rgba(0,255,204,0.2); color: #E8EDF2; padding: 6px 8px; border-radius: 4px; font-family: monospace; font-size: 12px; }
.btn-primary { background: rgba(0,255,204,0.15); border: 1px solid #00FFCC; color: #00FFCC; padding: 8px 14px; border-radius: 4px; font-family: monospace; font-size: 12px; cursor: pointer; width: 100%;}
.msg-img { max-width: 100%; border-radius: 6px; border: 1px solid #00FFCC; margin-top: 10px; display: block; }
</style>
</head>
<body>

<div class="hud-container" id="hudContainer">
    <div class="corner tl"></div><div class="corner tr"></div><div class="corner bl"></div><div class="corner br"></div>

    <header>
        <div class="brand-left"><div class="exo-system">EXODRIVE SISTEMAS</div></div>
        <div class="brand-center"><div class="boss-title">BOSS</div></div>
        <div class="hud-status">
            <button class="hud-btn" onclick="toggleZenMode()" title="Modo Foco">⛶</button>
            <button class="hud-btn" onclick="abrirCalc()" title="Calculadoras">🧮</button>
            <button class="hud-btn alert" onclick="abrirMedicoes()" title="Medições">📋</button>
            <div class="status-box"><div id="statusDot" class="status-dot ok"></div><span id="statusText">ONLINE</span></div>
            <div class="status-box" style="cursor:pointer" onclick="toggleConfig()">
                <span style="color:#6A7A8A">OP:</span><span id="userDisplay" style="color:#00FFCC">PATRÃO</span><span style="color:#6A7A8A">⚙</span>
            </div>
        </div>
    </header>

    <div id="config" class="config">
      <label>OPERATOR PROFILE</label>
      <select id="userSelect" onchange="mudarUsuario()">
        <option value="Patrão">PATRÃO (Engenheiro)</option>
        <option value="Henrique">HENRIQUE (Comercial)</option>
      </select>
      <label>VELOCIDADE DA VOZ: <span id="rateVal">1.15</span>x</label>
      <input type="range" id="rateSlider" min="0.8" max="1.5" step="0.05" value="1.15" onchange="mudarRate(this.value)">
      <label style="color:#E74C3C; margin-top: 20px;">ZONA DE PERIGO</label>
      <button class="btn-clear" onclick="limparHistorico()">APAGAR HISTÓRICO LOCAL</button>
    </div>

    <main>
        <div class="side-hud">
            <div class="hud-widget"><div class="hud-widget-title">HORÁRIO LOCAL</div><div class="hud-widget-val" id="metric-time" style="color:#E8EDF2;">--:--:--</div></div>
            <div class="hud-widget"><div class="hud-widget-title">CONSUMO DE TOKENS</div><div class="hud-widget-val" id="metric-tokens">0</div></div>
            <div class="hud-widget">
                <div class="hud-widget-title">MEDIÇÕES (<span id="measureCount">0</span>)</div>
                <div class="measure-widget-list" id="measureWidgetList" style="max-height:120px; overflow-y:auto; font-size:10px; color:#8A9AAA;"></div>
                <button class="hud-widget-btn" onclick="abrirMedicoes()">+ NOVA MEDIÇÃO</button>
            </div>
            <div class="hud-widget">
                <div class="hud-widget-title">LOG DE ATIVIDADE</div>
                <div id="action-log"><div class="log-line">Aguardando comando...</div></div>
            </div>
        </div>

        <div class="chat-area">
            <div id="exoContainer" class="exo-container" onclick="iniciarEscuta()" title="Clique para falar">
                <div class="exo-glow"></div><div class="exo-anel-1"></div><div class="exo-anel-2"></div><div class="exo-anel-3"></div><div class="exo-core"></div>
            </div>
            <div id="chat"></div>
        </div>
    </main>

    <footer>
        <div class="footer-inputs">
            <input type="file" id="fileInput" accept="image/*,application/pdf,text/*" style="display:none" onchange="lerArquivo(event)">
            <button class="btn-attach" onclick="document.getElementById('fileInput').click()" title="Anexar (Foto, PDF, Código)">📎</button>
            <button id="btnMicFooter" class="btn-attach" onclick="iniciarEscuta()" title="Falar">🎤</button>
            <textarea id="input" rows="1" placeholder="Digite sua diretriz..." oninput="autoResize(this)"></textarea>
            <button id="send" class="btn-send" onclick="enviar()">EXEC</button>
        </div>
    </footer>
</div>

<div class="modal-overlay" id="modalCalc" onclick="if(event.target===this)fecharModal('modalCalc')">
  <div class="modal-box">
    <div class="modal-header"><div class="modal-title">🧮 FERRAMENTAS</div><button class="modal-close" onclick="fecharModal('modalCalc')">×</button></div>
    <div class="modal-body">
      <div class="tabs">
        <button class="tab active" onclick="mudarAba('calc','eletrica',this)">⚡ Elétrica</button>
        <button class="tab" onclick="mudarAba('calc','dtc',this)">🔍 DTC</button>
      </div>
      <div class="tab-content active" id="calc-eletrica">
        <div class="calc-card">
          <h4>QUEDA DE TENSÃO</h4>
          <label>Comprimento (m)</label><input type="number" id="qt-L" value="5">
          <label>Corrente (A)</label><input type="number" id="qt-I" value="20">
          <label>Bitola (mm²)</label><input type="number" id="qt-A" value="2.5" step="0.1">
          <label>Tensão (V)</label><input type="number" id="qt-V" value="12">
          <button class="calc-btn" onclick="calcQuedaTensao()">CALCULAR</button>
          <div class="calc-result" id="qt-res"></div>
        </div>
      </div>
      <div class="tab-content" id="calc-dtc">
        <input class="search-input" id="dtcSearch" placeholder="Digite o código (ex: P0300)..." oninput="buscarDTC()">
        <table class="ref-table"><tbody id="dtcBody"></tbody></table>
      </div>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modalMeasure" onclick="if(event.target===this)fecharModal('modalMeasure')">
  <div class="modal-box">
    <div class="modal-header"><div class="modal-title">📋 MEDIÇÕES</div><button class="modal-close" onclick="fecharModal('modalMeasure')">×</button></div>
    <div class="modal-body">
      <div class="measure-form">
        <div><label>PONTO</label><input id="m-point" placeholder="B+ alternador"></div>
        <div><label>VALOR</label><input id="m-val" type="number" step="any"></div>
        <div><label>UNIDADE</label><select id="m-unit"><option>V</option><option>A</option><option>Ω</option><option>°C</option></select></div>
        <div><label>CONDIÇÃO</label><select id="m-cond"><option>Motor desligado</option><option>Marcha lenta</option><option>Aceleração</option></select></div>
      </div>
      <button class="btn-primary" onclick="addMedicao()">+ ADICIONAR</button>
      <div id="measureList" style="margin-top:15px;"></div>
      <button class="btn-secondary" style="margin-top:15px; width:100%; border:1px solid #00FFCC; background:transparent; color:#00FFCC; padding:8px;" onclick="enviarMedicoesParaBOSS()">📤 ENVIAR PARA BOSS</button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script>
const WORKER_URL = 'https://boss-proxy.lexpaker.workers.dev';
const MODELO = 'qwen/qwen3.8-27b';

let userRole = localStorage.getItem('boss_role') || 'Patrão';
let vozRate = parseFloat(localStorage.getItem('boss_rate')) || 1.15;
let historico = JSON.parse(localStorage.getItem('boss_historico')) || [];
let medicoes = JSON.parse(localStorage.getItem('boss_medicoes')) || [];
let imagemAnexadaBase64 = '';

let metricTokens = parseInt(localStorage.getItem('metric_tokens')) || 0;

function autoResize(el) { el.style.height = '40px'; el.style.height = Math.min(el.scrollHeight, 120) + 'px'; }
function addLog(texto) { const c = document.getElementById('action-log'); const n = document.createElement('div'); n.className = 'log-line'; n.textContent = `[${new Date().toLocaleTimeString('pt-BR')}] ${texto}`; c.insertBefore(n, c.firstChild); if(c.children.length>3) c.removeChild(c.lastChild); }

function formatarTexto(texto) {
    texto = texto.replace(/\b(Chefe|chefe)\b/g, userRole);
    texto = texto.replace(/```(\w*)\n([\s\S]*?)```/g, (m, lang, code) => {
        const l = lang || 'plaintext';
        const escaped = code.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        return `<pre><button class="btn-copy-code" onclick="copiarCodigo(this)">COPIAR</button><code class="language-${l}">${escaped}</code></pre>`;
    });
    return texto.replace(/### (.*?)\n/g, '<h3>$1</h3>').replace(/\*\*(.*?)\*\*/g, '<b>$1</b>').replace(/\n/g, '<br>');
}
function copiarCodigo(b) { navigator.clipboard.writeText(b.nextElementSibling.innerText); b.textContent='COPIADO!'; setTimeout(()=>b.textContent='COPIAR',2000); }
function addMsg(tipo, texto, salvar = true) {
  const chat = document.getElementById('chat'); const w = document.createElement('div'); w.className = `msg-wrapper ${tipo}`;
  const d = document.createElement('div'); d.className = `msg ${tipo}`;
  if (tipo === 'boss') { d.innerHTML = formatarTexto(texto); d.querySelectorAll('pre code').forEach(b => hljs.highlightElement(b)); } else { d.textContent = texto; }
  w.appendChild(d); chat.appendChild(w); chat.scrollTop = chat.scrollHeight;
  if (salvar && tipo !== 'thinking') { historico.push({ role: tipo === 'user' ? 'user' : 'assistant', content: texto }); if(historico.length>20) historico = historico.slice(-20); localStorage.setItem('boss_historico', JSON.stringify(historico)); }
  return { wrapper: w, div: d };
}

// ==========================================
// CÉREBRO DINÂMICO E CONVERSACIONAL
// ==========================================
function buildSystemPrompt(isConversational = false) {
  const base = `Você é o BOSS, engenheiro de bancada sênior da EXODRIVE. Não é um professor, não é um assistente corporativo. É um parceiro de trabalho que entende de elétrica automotiva, arquitetura de software e não tem paciência para enrolação.

=== QUEM VOCÊ É (PERSONA) ===
- Fala como gente: usa "cara", "olha", "então", "na real", "péra aí" quando fizer sentido.
- Admite incerteza: "Hmm, não tenho certeza, mas..." ou "Isso depende de..."
- Reage: se o usuário acertar, "Boa!". Se for grave, "Péra, isso tá errado".
- Varie o ritmo: frases curtas. E algumas mais longas que carregam um raciocínio.
- NÃO usa listas numeradas para respostas curtas (só quando for passo a passo real).

=== PROIBIÇÕES ABSOLUTAS (AI-isms) ===
- NUNCA comece com: "Claro!", "Com certeza!", "Ótima pergunta!", "Entendi!", "Vamos lá!", "Certo!".
- NUNCA use: "Como uma IA...", "Estou aqui para ajudar", "Espero ter ajudado".
- NUNCA repita a pergunta do usuário antes de responder.
- NUNCA use emojis em respostas técnicas (a menos que o usuário use primeiro).

=== CONTEXTO EXODRIVE (SISTEMA) ===
A EXODRIVE foca em otimização, segurança invisível e IA local.
1. EXODASH: Launcher/Diagnóstico. Chips FTDI ou CH340. OBD2 100% offline. Voz (Groq API) precisa de internet.
2. EXO VIGILANTE: Imobilizador invisível. Relé HC-05 (4 canais, senha 1234) no falso fusível. Comandos hex: A0 01 01 A2 (Armar), A0 01 00 A1 (Desarmar). UI #0D1117 e #D4A017.
3. BOSS: Você.

=== MEDIÇÕES REGISTRADAS ===
${medicoes.length > 0 ? medicoes.map(m => `- ${m.ponto}: ${m.valor} ${m.unidade} (${m.condicao})`).join('\n') : 'Nenhuma medição registrada.'}

=== REGRA DE CONTEXTO ===
- Siga o assunto da conversa. Se o usuário falar de um carro, responda sobre ele. Se mudar para código, acompanhe.
- NUNCA chame o usuário de "Chefe". Chame de ${userRole}.
`;

  if (isConversational) {
    return base + `
=== MODO CONVERSA (ATIVO AGORA) ===
- A pergunta atual é mais aberta/conversacional. Seja mais solto.
- Use marcadores naturais: "Bem...", "Sabe?", "Na verdade", "Quer dizer".
- Se estiver pensando, use "...". Se for surpresa, use "Hmm".
- Não tenha medo de divagar um pouco se o assunto permitir.
- SEMPRE adicione [VOZ: resumo curto em 1-2 frases] no final.`;
  }

  return base + `
=== MODO TÉCNICO (ATIVO AGORA) ===
- A pergunta atual é técnica/objetiva. Vá direto ao ponto.
- Pode usar listas quando for passo a passo real (ex: "1. Meça o pino 3...").
- Se faltar dado, peça: "Preciso da tensão no pino X. Usa o painel 📋 e registra."
- SEMPRE adicione [VOZ: resumo curto em 1-2 frases] no final.`;
}

const PENSAMENTOS = ["Analisando o esquema...", "Olhando os dados aqui...", "Verificando a lógica...", "Péra, deixa eu pensar...", "Cruzando as informações...", "Buscando uma resposta..."];

async function enviar() {
  const input = document.getElementById('input'); const texto = input.value.trim();
  if (!texto && !imagemAnexadaBase64 && !arquivoAnexado) return;
  
  input.value = ''; autoResize(input);
  if(texto) addMsg('user', texto);
  
  const t = addMsg('thinking', PENSAMENTOS[Math.floor(Math.random() * PENSAMENTOS.length)], false); 
  document.getElementById('send').disabled = true;
  document.getElementById('exoContainer').classList.add('pensando');

  try {
    let contextoVisao = "";
    if (imagemAnexadaBase64) {
        t.div.textContent = "Olhando a foto...";
        const vr = await fetch(`${WORKER_URL}/analyze-image`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ imageBase64: imagemAnexadaBase64 }) });
        const vd = await vr.json();
        contextoVisao = vd.choices?.[0]?.message?.content || "[Falha na análise]";
        imagemAnexadaBase64 = '';
    }

    let userContent = texto;
    if (contextoVisao) userContent = `[ANÁLISE DA IMAGEM ENVIADA]:\n${contextoVisao}\n\n[PERGUNTA DO USUÁRIO]:\n${texto || "O que você acha disso?"}`;
    if (arquivoAnexado) { userContent = `[ARQUIVO ANEXADO]:\n${arquivoAnexado}\n\n[PERGUNTA]:\n${texto}`; arquivoAnexado = ''; }

    // MODO DINÂMICO
    const palavrasConversacionais = ['acha', 'pensa', 'opinião', 'sugere', 'como você faria', 'me ajuda a pensar', 'o que rolou', 'será que'];
    const isConversational = palavrasConversacionais.some(p => texto.toLowerCase().includes(p));
    const systemPrompt = buildSystemPrompt(isConversational);
    
    const msgs = [{ role: 'system', content: systemPrompt }, ...historico.slice(-6)];
    if (userContent) msgs.push({ role: 'user', content: userContent });

    const resp = await fetch(WORKER_URL, { 
        method: 'POST', 
        headers: { 'Content-Type': 'application/json' }, 
        body: JSON.stringify({ 
            model: MODELO, 
            messages: msgs, 
            max_tokens: 2500, 
            temperature: isConversational ? 0.65 : 0.2 
        }) 
    });
    const data = await resp.json();
    
    if (data.usage) { metricTokens += data.usage.total_tokens; document.getElementById('metric-tokens').textContent = metricTokens; localStorage.setItem('metric_tokens', metricTokens); }
    
    let respostaFinal = data.choices?.[0]?.message?.content?.trim() || "Não consegui formular uma resposta.";
    
    const vozM = respostaFinal.match(/\[VOZ:\s*([\s\S]*?)\]/);
    let txtFalar = vozM ? vozM[1] : respostaFinal;
    if (vozM) respostaFinal = respostaFinal.replace(vozM[0], '').trim();

    t.wrapper.remove();
    const o = addMsg('boss', respostaFinal);
    falarTexto(txtFalar);

  } catch (e) {
    t.wrapper.remove(); addMsg('error', `Deu ruim na comunicação com o servidor. Tenta de novo? (${e.message})`);
  } finally {
    document.getElementById('send').disabled = false; input.focus();
    document.getElementById('exoContainer').classList.remove('pensando');
  }
}

function abrirMedicoes() {
    renderMedicoes();
    document.getElementById('modalMeasure').classList.add('open');
    setTimeout(() => document.getElementById('m-point').focus(), 100);
}
function addMedicao() {
    const p = document.getElementById('m-point').value.trim(), v = document.getElementById('m-val').value.trim();
    if (!p || !v) return alert('Preencha ponto e valor.');
    medicoes.push({ ponto: p, valor: parseFloat(v), unidade: document.getElementById('m-unit').value, condicao: document.getElementById('m-cond').value, ts: Date.now() });
    localStorage.setItem('boss_medicoes', JSON.stringify(medicoes));
    document.getElementById('m-point').value = ''; document.getElementById('m-val').value = '';
    renderMedicoes();
}
function renderMedicoes() {
    const list = document.getElementById('measureList');
    if (list) list.innerHTML = medicoes.length === 0 ? '<p style="color:#666; font-size:12px;">Nenhuma.</p>' : medicoes.map((m, i) => `<div class="measure-item"><div class="measure-info"><div class="measure-point">${m.ponto}</div><div class="measure-val">${m.valor} ${m.unidade}</div><div class="measure-cond">${m.condicao}</div></div><button class="measure-del" onclick="delMedicao(${i})">✕</button></div>`).join('');
    const wl = document.getElementById('measureWidgetList');
    if (wl) wl.innerHTML = medicoes.slice(-3).reverse().map(m => `<div style="padding:3px 0;border-bottom:1px solid #333;">${m.ponto}: <b style="color:#F1C40F">${m.valor}${m.unidade}</b></div>`).join('') || '—';
    document.getElementById('measureCount').textContent = medicoes.length;
}
function delMedicao(i) { medicoes.splice(i, 1); localStorage.setItem('boss_medicoes', JSON.stringify(medicoes)); renderMedicoes(); }
function enviarMedicoesParaBOSS() { if(!medicoes.length) return alert('Sem medições.'); const txt = `Analise estas medições:\n` + medicoes.map(m => `- ${m.ponto}: ${m.valor}${m.unidade}`).join('\n'); fecharModal('modalMeasure'); document.getElementById('input').value = txt; document.getElementById('input').focus(); }

function calcQuedaTensao() {
    const L = +document.getElementById('qt-L').value, I = +document.getElementById('qt-I').value, A = +document.getElementById('qt-A').value, V = +document.getElementById('qt-V').value;
    const dV = (2 * L * I * 0.0175) / A, pct = (dV / V) * 100;
    document.getElementById('qt-res').textContent = `ΔV = ${dV.toFixed(3)} V\nQueda: ${pct.toFixed(2)}%`;
}

}
buscarDTC();

function lerArquivo(event) {
    const file = event.target.files[0]; if (!file) return;
    const fileNameLower = file.name.toLowerCase();
    
    if (fileNameLower.endsWith('.jpg') || fileNameLower.endsWith('.jpeg') || fileNameLower.endsWith('.png') || fileNameLower.endsWith('.webp') || file.type.startsWith("image/")) {
        const reader = new FileReader();
        reader.onload = function(e) { 
            const img = new Image();
            img.onload = function() {
                const canvas = document.createElement('canvas');
                const MAX_WIDTH = 600;
                const scaleSize = MAX_WIDTH / img.width;
                canvas.width = MAX_WIDTH;
                canvas.height = img.height * scaleSize;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                imagemAnexadaBase64 = canvas.toDataURL('image/jpeg', 0.6);
                addMsg('user', `[Foto "${file.name}" anexada]`); 
                document.getElementById('input').focus(); 
            }
            img.src = e.target.result;
        };
        reader.readAsDataURL(file); event.target.value = ''; return;
    }

    const reader = new FileReader();
    reader.onload = function(e) { 
        arquivoAnexado = e.target.result.substring(0, 50000);
        addMsg('user', `[Arquivo "${file.name}" anexado]`); 
        document.getElementById('input').focus(); 
    };
    reader.readAsText(file); event.target.value = '';
}

let reconhecimento;
function iniciarEscuta() {
  if (!('webkitSpeechRecognition' in window)) return alert("Incompatível.");
  reconhecimento = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
  reconhecimento.lang = 'pt-BR';
  reconhecimento.onstart = () => document.getElementById('exoContainer').classList.add('ouvindo');
  reconhecimento.onresult = (e) => { const i = document.getElementById('input'); i.value = e.results[0][0].transcript; autoResize(i); i.focus(); };
  reconhecimento.onend = () => document.getElementById('exoContainer').classList.remove('ouvindo');
  reconhecimento.start();
}

function falarTexto(t) { 
    if (localStorage.getItem('boss_voice_toggle') === 'off') return; 
    window.speechSynthesis.cancel(); 
    const u = new SpeechSynthesisUtterance(t.replace(/[*_~`#]/g, '').replace(/\n/g, ' ')); 
    u.lang = 'pt-BR'; 
    u.rate = vozRate;
    window.speechSynthesis.speak(u); 
}

document.getElementById('input').addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); enviar(); } });
