<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BOSS - EXO SYSTEM</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { 
    background-color: #05070A; 
    background-image: linear-gradient(rgba(0, 255, 204, 0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(0, 255, 204, 0.03) 1px, transparent 1px);
    background-size: 30px 30px; color: #E8EDF2; font-family: 'Segoe UI', Roboto, sans-serif; height: 100vh; display: flex; justify-content: center; align-items: center; overflow: hidden; 
}
.hud-container { width: 98vw; height: 96vh; border: 1px solid rgba(0, 255, 204, 0.2); position: relative; display: flex; flex-direction: column; background: rgba(5, 7, 10, 0.85); box-shadow: inset 0 0 50px rgba(0, 255, 204, 0.05); }
.corner { position: absolute; width: 25px; height: 25px; border: 2px solid #00FFCC; }
.tl { top: -2px; left: -2px; border-right: none; border-bottom: none; } .tr { top: -2px; right: -2px; border-left: none; border-bottom: none; }
.bl { bottom: -2px; left: -2px; border-right: none; border-top: none; } .br { bottom: -2px; right: -2px; border-left: none; border-top: none; }
header { padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(0, 255, 204, 0.1); z-index: 10; background: linear-gradient(90deg, rgba(0,255,204,0.05) 0%, transparent 50%); }
.brand-left { display: flex; flex-direction: column; }
.exo-system { color: #00FFCC; font-size: 10px; font-weight: bold; letter-spacing: 0.3em; opacity: 0.7; }
.boss-title { color: #FFFFFF; font-size: 20px; font-weight: 300; letter-spacing: 0.5em; text-shadow: 0 0 10px rgba(0,255,204,0.3); }
.hud-status { display: flex; gap: 20px; align-items: center; font-family: monospace; font-size: 11px; letter-spacing: 0.1em; }
.status-box { display: flex; align-items: center; gap: 6px; }
.status-dot { width: 6px; height: 6px; border-radius: 50%; background: #6A7A8A; }
.status-dot.ok { background: #27AE60; box-shadow: 0 0 8px #27AE60; }
.status-dot.err { background: #E74C3C; box-shadow: 0 0 8px #E74C3C; }
main { flex: 1; display: flex; flex-direction: column; align-items: center; position: relative; overflow: hidden; }
.exo-container { margin-top: 20px; position: relative; width: 200px; height: 200px; display: flex; justify-content: center; align-items: center; cursor: pointer; transition: all 0.3s ease; }
.exo-glow { position: absolute; width: 200px; height: 200px; border-radius: 50%; background: radial-gradient(circle, rgba(0,255,204,0.15) 0%, transparent 70%); transition: all 0.3s ease; }
.exo-anel-1 { position: absolute; width: 180px; height: 180px; border-radius: 50%; border: 1px dashed rgba(0,255,204,0.3); animation: gira 20s linear infinite; }
.exo-anel-2 { position: absolute; width: 150px; height: 150px; border-radius: 50%; border: 2px solid rgba(0,255,204,0.2); border-left-color: #00FFCC; animation: gira-rev 12s linear infinite; }
.exo-anel-3 { position: absolute; width: 120px; height: 120px; border-radius: 50%; border: 1px solid rgba(0,255,204,0.5); border-right-color: transparent; border-left-color: transparent; animation: gira 8s linear infinite; }
.exo-core { position: relative; width: 80px; height: 80px; border-radius: 50%; background: radial-gradient(circle at 30% 30%, #1A1F28, #0A0D12); border: 2px solid #00FFCC; display: flex; justify-content: center; align-items: center; box-shadow: 0 0 30px rgba(0,255,204,0.4); transition: all 0.3s ease; }
@keyframes gira { to { transform: rotate(360deg); } } @keyframes gira-rev { to { transform: rotate(-360deg); } }
.exo-container.ouvindo .exo-core { border-color: #E74C3C; box-shadow: 0 0 40px rgba(231,76,60,0.6); animation: pulse-fast 1s infinite; }
.exo-container.ouvindo .exo-glow { background: radial-gradient(circle, rgba(231,76,60,0.2) 0%, transparent 70%); }
.exo-container.pensando .exo-core { border-color: #F1C40F; box-shadow: 0 0 40px rgba(241,196,15,0.6); }
.exo-container.pensando .exo-anel-2 { animation-duration: 2s; border-left-color: #F1C40F; } .exo-container.pensando .exo-anel-3 { animation-duration: 1s; border-top-color: #F1C40F; }
.exo-container.falando .exo-core { border-color: #00FFCC; box-shadow: 0 0 50px rgba(0,255,204,0.8); animation: pulse-slow 1.5s infinite; }
.exo-container.falando .exo-anel-1 { animation-duration: 5s; }
@keyframes pulse-fast { 0% { transform: scale(1); } 50% { transform: scale(1.08); } 100% { transform: scale(1); } }
@keyframes pulse-slow { 0% { box-shadow: 0 0 30px rgba(0,255,204,0.4); } 50% { box-shadow: 0 0 60px rgba(0,255,204,1); } 100% { box-shadow: 0 0 30px rgba(0,255,204,0.4); } }
#chat { flex: 1; width: 100%; max-width: 900px; overflow-y: auto; padding: 20px 40px; display: flex; flex-direction: column; gap: 15px; mask-image: linear-gradient(to bottom, transparent, black 5%, black 95%, transparent); }
.msg { font-family: monospace; font-size: 13px; line-height: 1.6; padding-left: 15px; border-left: 2px solid transparent; word-wrap: break-word; }
.msg.user { border-left-color: #6A7A8A; color: #8A9AAA; } .msg.user::before { content: "USR > "; color: #6A7A8A; font-weight: bold; }
.msg.boss { border-left-color: #00FFCC; color: #E8EDF2; } .msg.boss::before { content: "SYS > "; color: #00FFCC; font-weight: bold; }
.msg.error { border-left-color: #E74C3C; color: #E74C3C; } .msg.error::before { content: "ERR > "; font-weight: bold; }
.msg.thinking { color: #F1C40F; font-style: italic; border-left-color: #F1C40F; animation: blink 1s infinite; } .msg.thinking::before { content: "PROC > "; font-weight: bold; }
@keyframes blink { 50% { opacity: 0.5; } }
footer { padding: 15px 30px; border-top: 1px solid rgba(0, 255, 204, 0.1); background: #080A0F; display: flex; justify-content: space-between; align-items: center; z-index: 10; }
.footer-inputs { display: flex; gap: 10px; flex: 1; max-width: 800px; align-items: flex-end; }
.btn-attach { background: transparent; border: 1px solid #6A7A8A; color: #6A7A8A; padding: 8px 12px; border-radius: 4px; cursor: pointer; transition: all 0.2s; font-size: 16px; }
.btn-attach:hover { border-color: #00FFCC; color: #00FFCC; }
#input { flex: 1; background: transparent; border: none; border-bottom: 1px solid rgba(0,255,204,0.3); color: #00FFCC; padding: 8px 0; font-size: 14px; font-family: monospace; resize: none; outline: none; height: 36px; max-height: 120px; }
#input::placeholder { color: rgba(0,255,204,0.3); } #input:focus { border-bottom-color: #00FFCC; box-shadow: 0 10px 10px -10px rgba(0,255,204,0.3); }
.btn-send { background: transparent; color: #00FFCC; border: 1px solid #00FFCC; padding: 8px 20px; border-radius: 4px; font-weight: bold; cursor: pointer; font-family: monospace; transition: all 0.2s; height: 36px; }
.btn-send:hover { background: rgba(0,255,204,0.1); box-shadow: 0 0 10px rgba(0,255,204,0.3); } .btn-send:disabled { opacity: 0.3; cursor: not-allowed; }
.by-alex { color: #6A7A8A; font-size: 10px; letter-spacing: 0.2em; font-family: monospace; }
.config { padding: 20px; display: none; background: #0D1117; border: 1px solid #00FFCC; position: absolute; top: 60px; right: 30px; z-index: 20; border-radius: 4px; box-shadow: 0 10px 30px rgba(0,0,0,0.9), 0 0 20px rgba(0,255,204,0.2); width: 250px; }
.config.open { display: block; } .config label { font-size: 10px; color: #00FFCC; margin-bottom:8px; display:block; font-family: monospace; }
.config select { width: 100%; background: #05070A; border: 1px solid rgba(0,255,204,0.3); color: #E8EDF2; padding: 8px; border-radius: 4px; font-size: 12px; font-family: monospace; outline: none; margin-bottom: 15px; }
.btn-clear { width: 100%; background: transparent; border: 1px solid #E74C3C; color: #E74C3C; padding: 8px; border-radius: 4px; font-family: monospace; font-size: 11px; cursor: pointer; }
.btn-clear:hover { background: rgba(231, 76, 60, 0.1); }
</style>
</head>
<body>

<div class="hud-container">
    <div class="corner tl"></div><div class="corner tr"></div><div class="corner bl"></div><div class="corner br"></div>

    <header>
        <div class="brand-left">
            <div class="exo-system">EXO SYSTEM</div>
            <div class="boss-title">BOSS</div>
        </div>
        <div class="hud-status">
            <div class="status-box">
                <div id="statusDot" class="status-dot"></div>
                <span id="statusText">OFFLINE</span>
            </div>
            <div class="status-box" style="cursor:pointer" onclick="toggleConfig()">
                <span style="color:#6A7A8A">OPERATOR:</span>
                <span id="userDisplay" style="color:#00FFCC">CHEFE</span>
                <span style="color:#6A7A8A">⚙</span>
            </div>
        </div>
    </header>

    <div id="config" class="config">
      <label>OPERATOR PROFILE</label>
      <select id="userSelect" onchange="mudarUsuario()">
        <option value="Chefe">CHEFE (Engenheiro)</option>
        <option value="Mecânico">HENRIQUE (Diagnóstico)</option>
        <option value="Convidado">CONVIDADO (Visão Geral)</option>
      </select>
      <button class="btn-clear" onclick="limparHistorico()">APAGAR HISTÓRICO</button>
    </div>

    <main>
        <div id="exoContainer" class="exo-container" onclick="toggleGravacao()" title="Clique para falar">
            <div class="exo-glow"></div>
            <div class="exo-anel-1"></div>
            <div class="exo-anel-2"></div>
            <div class="exo-anel-3"></div>
            <!-- Raio removido daqui -->
            <div class="exo-core"></div>
        </div>

        <div id="chat">
            <!-- As mensagens vão aqui -->
        </div>
    </main>

    <footer>
        <div class="footer-inputs">
            <input type="file" id="fileInput" style="display:none" onchange="lerArquivo(event)">
            <button class="btn-attach" onclick="document.getElementById('fileInput').click()" title="Anexar arquivo local">📎</button>
            <textarea id="input" rows="1" placeholder="Digite sua diretriz..."></textarea>
            <button id="send" class="btn-send" onclick="enviar()">EXEC</button>
        </div>
        <div class="by-alex">BY ALEX. P</div>
    </footer>
</div>

<script>
const WORKER_URL = 'https://boss-proxy.lexpaker.workers.dev'; 
const REPO_PROJETO = 'lexpaker-arch/EXODASH--Local'; 
const REPO_CONTEXTO = 'lexpaker-arch/BOSS-'; 
const MODELO = 'qwen/qwen3.8-27b';

let userRole = localStorage.getItem('boss_role') || 'Chefe';
let historico = JSON.parse(localStorage.getItem('boss_historico')) || [];
let contextoCache = { projetos: '' }; 
let exoContainer = document.getElementById('exoContainer');
let arquivoAnexado = '';

document.getElementById('userDisplay').textContent = userRole.toUpperCase();
document.getElementById('userSelect').value = userRole;

// Restaura o histórico visual ao carregar a página
function restaurarHistorico() {
    const chat = document.getElementById('chat');
    chat.innerHTML = ''; // Limpa a tela
    if (historico.length === 0) {
        addMsg('boss', 'Sistema BOSS inicializado. Conexão com o núcleo EXO estabelecida.');
    } else {
        historico.forEach(m => {
            const tipo = m.role === 'user' ? 'user' : 'boss';
            addMsg(tipo, m.content, false); // false significa que não salva de novo no localStorage
        });
    }
}

async function fetchGithubFile(repo, path) {
    try {
        const res = await fetch(`${WORKER_URL}/github?repo=${repo}&path=${path}`);
        const data = await res.json();
        if (data.content) return decodeURIComponent(escape(atob(data.content)));
        return '';
    } catch (e) { return ''; }
}

async function carregarContexto() {
  try {
    const [projetos, decisoes] = await Promise.all([
      fetchGithubFile(REPO_CONTEXTO, 'contexto/projetos.md'),
      fetchGithubFile(REPO_CONTEXTO, 'contexto/decisoes.md')
    ]);
    contextoCache.projetos = projetos + "\n" + decisoes;
    atualizarStatus(true);
  } catch (e) {
    atualizarStatus(false);
  }
}

function atualizarStatus(ok) {
  const dot = document.getElementById('statusDot');
  const txt = document.getElementById('statusText');
  if (ok) {
      dot.className = 'status-dot ok'; txt.textContent = 'ONLINE'; txt.style.color = '#27AE60';
  } else {
      dot.className = 'status-dot err'; txt.textContent = 'OFFLINE'; txt.style.color = '#E74C3C';
  }
}

function toggleConfig() { document.getElementById('config').classList.toggle('open'); }

function mudarUsuario() {
  userRole = document.getElementById('userSelect').value;
  localStorage.setItem('boss_role', userRole);
  document.getElementById('userDisplay').textContent = userRole.toUpperCase();
  addMsg('boss', `Perfil de operador alterado para ${userRole.toUpperCase()}.`);
  toggleConfig();
}

function limparHistorico() {
    if(confirm("Apagar todo o histórico de conversas?")) {
        historico = [];
        localStorage.removeItem('boss_historico');
        restaurarHistorico();
        toggleConfig();
    }
}

function addMsg(tipo, texto, salvar = true) {
  const chat = document.getElementById('chat');
  const div = document.createElement('div');
  div.className = `msg ${tipo}`;
  div.textContent = texto;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  
  // Salva no histórico local (se for uma mensagem real do user ou boss)
  if (salvar && tipo !== 'thinking' && tipo !== 'error') {
      historico.push({ role: tipo === 'user' ? 'user' : 'assistant', content: texto });
      // Mantém apenas as últimas 20 mensagens no localStorage para não encher
      if(historico.length > 20) historico = historico.slice(-20);
      localStorage.setItem('boss_historico', JSON.stringify(historico));
  }
  return div;
}

// LER ARQUIVO LOCAL
function lerArquivo(event) {
    const file = event.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = function(e) {
        const texto = e.target.result;
        // Limita a 50.000 caracteres para não estourar o limite de tokens da API
        arquivoAnexado = texto.substring(0, 50000); 
        addMsg('boss', `[Arquivo "${file.name}" anexado. Faça sua pergunta sobre ele.]`);
        document.getElementById('input').focus();
    };
    reader.readAsText(file);
    
    // Limpa o input file para permitir anexar o mesmo arquivo duas vezes
    event.target.value = ''; 
}

function buildSystemPrompt() {
  let roleInstruction = "";
  
  if (userRole === "Chefe") {
    roleInstruction = "O operador é o Chefe, o criador e arquiteto do sistema. Fale de forma técnica, direta, sem simplificar termos de engenharia de software. Foque no desenvolvimento Android, Kotlin, lógica de negócios e melhorias no código.";
  } 
  else if (userRole === "Henrique") {
    roleInstruction = "O operador é o Henrique, o especialista em diagnóstico automotivo. Fale de forma prática e direta. Foque em OBD2, leitura de DTCs, sintomas de falhas, testes de componentes, motores e peças. Evite jargões de programação se não for necessário.";
  } 
  else {
    roleInstruction = "O operador é um Convidado. Seja educado, acolhedor e explique os conceitos (tanto de carro quanto de tecnologia) de forma simples, clara e sem termos muito complexos. Ajude no que for possível.";
  }

  let prompt = `Você é o BOSS, assistente do EXO SYSTEM.
${roleInstruction}

=== CONTEXTO DO PROJETO (Base de Conhecimento) ===
${contextoCache.projetos}

Responda de forma concisa, adaptando o tom para o perfil do operador atual.`;

  if (arquivoAnexado) {
      prompt += `\n\n=== ARQUIVO ANEXADO PELO USUÁRIO ===\n${arquivoAnexado}\n\nUse o conteúdo do arquivo anexado acima para responder a próxima pergunta.`;
  }

  return prompt;
}
}

async function enviar() {
  const input = document.getElementById('input');
  const texto = input.value.trim();
  if (!texto) return;

  input.value = '';
  addMsg('user', texto);

  const thinking = addMsg('thinking', 'Processando diretriz...', false);
  document.getElementById('send').disabled = true;
  
  exoContainer.classList.remove('ouvindo', 'falando');
  exoContainer.classList.add('pensando');

  try {
    const messages = [
      { role: 'system', content: buildSystemPrompt() },
      ...historico.slice(-6) 
    ];

    const resp = await fetch(WORKER_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ model: MODELO, messages, max_tokens: 600, temperature: 0.3 })
    });

    const data = await resp.json();
    
    let resposta;
    if (data.choices && data.choices[0] && data.choices[0].message) {
      resposta = data.choices[0].message.content.trim();
    } else if (data.error) {
      resposta = "⚠️ Erro no núcleo: " + JSON.stringify(data.error);
    } else {
      resposta = "⚠️ Falha na matriz de resposta.";
    }

    thinking.remove();
    addMsg('boss', resposta);
    
    // Limpa o arquivo anexado após a resposta
    if(arquivoAnexado) {
        arquivoAnexado = '';
        // Opcional: avisar que o anexo foi limpo
    }

    exoContainer.classList.remove('pensando');
    exoContainer.classList.add('falando');
    falarTexto(resposta);

  } catch (e) {
    thinking.remove();
    addMsg('error', `Falha de comunicação: ${e.message}`);
    exoContainer.classList.remove('pensando');
  } finally {
    document.getElementById('send').disabled = false;
    input.focus();
  }
}

let reconhecimento;
let gravando = false;

function toggleGravacao() {
  if (gravando) { reconhecimento.stop(); return; }
  if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) { alert("Navegador incompatível com captura de voz."); return; }

  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  reconhecimento = new SpeechRecognition();
  reconhecimento.lang = 'pt-BR';
  reconhecimento.interimResults = false;

  reconhecimento.onstart = () => {
    gravando = true;
    exoContainer.classList.remove('pensando', 'falando');
    exoContainer.classList.add('ouvindo');
  };

  reconhecimento.onresult = (event) => {
    const texto = event.results[0][0].transcript;
    document.getElementById('input').value = texto;
    enviar();
  };

  reconhecimento.onend = () => {
    gravando = false;
    exoContainer.classList.remove('ouvindo');
  };

  reconhecimento.start();
}

function falarTexto(texto) {
  if (!('speechSynthesis' in window)) { exoContainer.classList.remove('falando'); return; }
  window.speechSynthesis.cancel();
  const utterance = new SpeechSynthesisUtterance(texto);
  utterance.lang = 'pt-BR';
  const voices = window.speechSynthesis.getVoices();
  const ptVoice = voices.find(v => v.lang.includes('pt-BR'));
  if (ptVoice) utterance.voice = ptVoice;
  utterance.rate = 1.1;
  
  utterance.onstart = () => {
      exoContainer.classList.remove('pensando');
      exoContainer.classList.add('falando');
  };
  
  utterance.onend = () => {
      exoContainer.classList.remove('falando');
  };

  window.speechSynthesis.speak(utterance);
}

document.getElementById('input').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); enviar(); }
});

// Inicialização
carregarContexto();
restaurarHistorico();
</script>
</body>
</html>
